<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Forgot Password - EventHub</title><link rel="stylesheet" href="css/style.css"/></head><body><div id="navbar" class="navbar"></div><div class="auth-wrapper"><div class="auth-card"><div class="auth-icon">🔐</div><h1>Reset your password</h1><p class="tagline">We’ll send a secure reset link to your inbox.</p><div class="auth-box"><div id="alertBox"></div><form id="forgotForm"><div class="form-group"><label for="email">Email</label><input id="email" class="form-control" type="email" placeholder="you@example.com" required/></div><button id="submitBtn" class="btn btn-primary btn-block" type="submit">Send reset link</button></form><p class="switch"><a href="login.html">Back to sign in</a></p></div></div></div><script src="js/api.js"></script><script src="js/nav.js"></script><script>renderNavbar('login');const form=document.getElementById('forgotForm'),alertBox=document.getElementById('alertBox'),submitBtn=document.getElementById('submitBtn');form.addEventListener('submit',async(e)=>{e.preventDefault();submitBtn.disabled=true;submitBtn.textContent='Sending...';try{const result=await Api.forgotPassword(document.getElementById('email').value.trim());showAlert(alertBox,result.message,'success');form.reset();}catch(err){showAlert(alertBox,err.message);}finally{submitBtn.disabled=false;submitBtn.textContent='Send reset link';}});</script></body></html>
