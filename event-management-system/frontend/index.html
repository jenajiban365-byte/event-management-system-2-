<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EventHub - Discover & Book Events</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="hero">
  <div class="live-badge" id="liveBadge">✨ Loading events...</div>
  <h1>Find the event <span class="accent-text">worth</span><br />leaving the house for.</h1>
  <p class="subtitle">Conferences, concerts, races and workshops — search, filter, and lock in your spot in under a minute.</p>
  <a href="events.html" class="btn btn-primary">Browse Events</a>
</div>

<footer class="site-footer">EventHub &mdash; Event Management System</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNavbar('home');

  (async function loadLiveCount() {
    const liveBadge = document.getElementById('liveBadge');
    try {
      const { events } = await Api.getEvents('?upcoming=true');
      liveBadge.textContent = `✨ ${events.length} event${events.length === 1 ? '' : 's'} live right now`;
    } catch (err) {
      liveBadge.textContent = '✨ Discover upcoming events';
    }
  })();
</script>
</body>
</html>
