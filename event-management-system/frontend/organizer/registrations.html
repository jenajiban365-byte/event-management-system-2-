<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrations - EventHub</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="navbar" class="navbar"></div><main class="container"><div class="page-header"><div><span class="eyebrow">ORGANIZER</span><h1>Registrations</h1><p>See who registered for your campus events.</p></div><button class="btn btn-outline" id="exportCsv">Export CSV</button></div><div id="alertBox"></div><div class="form-group" style="max-width:520px"><label>Choose event</label><select id="eventSelect" class="form-control"></select></div><div class="card" style="margin:18px 0"><h3>Send announcement</h3><div class="form-grid"><div class="form-group"><label>Title</label><input id="announcementTitle" class="form-control" placeholder="Venue update"></div><div class="form-group"><label>Audience</label><select id="announcementAudience" class="form-control"><option value="registrants">Registered students</option><option value="followers">Club followers</option><option value="both">Both</option></select></div><div class="form-group full"><label>Message</label><textarea id="announcementMessage" class="form-control" rows="3" placeholder="Your event has moved to Seminar Hall..."></textarea></div><div class="form-group full"><button class="btn btn-primary" id="sendAnnouncement">Send announcement</button></div></div></div><div class="table-wrap" style="margin-top:20px"><table class="data-table"><thead><tr><th>Student</th><th>Email</th><th>Student ID</th><th>Department</th><th>Status</th><th>Action</th><th>Check-in</th></tr></thead><tbody id="body"></tbody></table></div></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireOrganizer();renderNavbar('organizer');const select=document.getElementById('eventSelect'),body=document.getElementById('body'),alertBox=document.getElementById('alertBox');let currentBookings=[];let events=[];async function init(){try{events=(await Api.getOrganizerEvents()).events;select.innerHTML=events.map(e=>`<option value="${e.id}">${escapeHtml(e.title)} — ${formatDate(e.date)}</option>`).join('');const id=new URLSearchParams(location.search).get('event');if(id&&events.some(e=>e.id===id))select.value=id;await load()}catch(e){showAlert(alertBox,e.message)}}async function load(){if(!select.value)return;try{const {bookings}=await Api.getEventRegistrations(select.value);currentBookings=bookings;body.innerHTML=bookings.length?bookings.map(b=>`<tr><td>${escapeHtml(b.user?.name||'Unknown')}</td><td>${escapeHtml(b.user?.email||'')}</td><td>${escapeHtml(b.user?.studentId||'—')}</td><td>${escapeHtml(b.user?.department||'—')}</td><td><span class="badge ${b.status==='confirmed'?'badge-success':b.status==='pending'?'badge-warning':'badge-danger'}">${b.status}</span></td><td>${b.status==='pending'?`<button class="btn btn-primary btn-sm" data-approve="${b.id}">Approve</button> <button class="btn btn-danger btn-sm" data-reject="${b.id}">Reject</button>`:'—'}</td><td>${b.checkedInAt?'<span class="badge badge-success">Checked in</span>':`<span class="badge badge-muted">Not yet</span>`}</td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;color:var(--text-muted)">No registrations yet.</td></tr>'}catch(e){showAlert(alertBox,e.message)}document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{try{await Api.updateOrganizerRegistration(b.dataset.approve,'confirmed');load()}catch(e){showAlert(alertBox,e.message)}});document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{try{await Api.updateOrganizerRegistration(b.dataset.reject,'rejected');load()}catch(e){showAlert(alertBox,e.message)}})}document.getElementById('exportCsv').onclick=()=>{if(!currentBookings.length)return;const rows=[['Name','Email','Student ID','Department','Status','Checked In'],...currentBookings.map(b=>[b.user?.name||'',b.user?.email||'',b.user?.studentId||'',b.user?.department||'',b.status,b.checkedInAt?'Yes':'No'])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='eventhub-registrations.csv';a.click();URL.revokeObjectURL(a.href)};document.getElementById('sendAnnouncement').onclick=async()=>{try{await Api.announceEvent(select.value,{title:announcementTitle.value.trim(),message:announcementMessage.value.trim(),audience:announcementAudience.value});showAlert(alertBox,'Announcement sent.','success');announcementTitle.value='';announcementMessage.value='';}catch(e){showAlert(alertBox,e.message)}};select.onchange=load;init();</script></body></html>
