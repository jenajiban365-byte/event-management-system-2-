<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer Events - EventHub</title><link rel="stylesheet" href="../css/style.css?v=37">
<link rel="stylesheet" href="../css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="../css/mobile-polish.css?v=52">
<link rel="stylesheet" href="../css/eventhub-v61.css?v=61">
<link rel="stylesheet" href="../css/v59-final-ui.css?v=591">
  <link rel="stylesheet" href="../css/mobile-v63.css?v=63.1">
</head><body><div id="navbar" class="navbar"></div><main class="container organizer-events-page"><div class="page-header"><div><span class="eyebrow">ORGANIZER</span><h1>Campus Events</h1><p>Manage the complete EventHub event registry — including admin-created, club-created and organizer-created events.</p></div><a class="btn btn-primary" href="create-event.html">＋ Create event</a></div><div id="alertBox"></div><div class="table-wrap organizer-events-table"><table class="data-table"><thead><tr><th>Event</th><th>Club</th><th>Date</th><th>Status</th><th>Registrations</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireOrganizer();renderOrganizerNavbar('events');const body=document.getElementById('body'),alertBox=document.getElementById('alertBox');function status(s){const cls={published:'badge-success',pending_approval:'badge-warning',registration_closed:'badge-danger',ongoing:'badge-primary',completed:'badge-muted',registration_open:'badge-success',draft:'badge-muted',changes_requested:'badge-warning',rejected:'badge-danger',cancelled:'badge-danger'}[s]||'badge-muted';return `<span class="badge ${cls}">${escapeHtml(s.replaceAll('_',' '))}</span>`}async function load(){try{const {events}=await Api.getOrganizerEvents();body.innerHTML=events.length?events.map(e=>`<tr><td data-label="Event"><div class="organizer-event-title"><strong>${escapeHtml(e.title)}</strong></div><span class="organizer-event-sub">${escapeHtml(e.category||'Campus event')}</span></td><td data-label="Club">${escapeHtml(e.club?.name||'Campus-wide')}</td><td data-label="Date">${formatDate(e.date)}${e.endTime?` · ${escapeHtml(e.time)}–${escapeHtml(e.endTime)}`:` · ${escapeHtml(e.time||'')}`}</td><td data-label="Status">${status(e.status)}${e.lifecycle?`<br><span class="badge badge-muted">${escapeHtml(e.lifecycle.replaceAll('_',' '))}</span>`:''}</td><td data-label="Registrations">${e.bookedCount}/${e.capacity}<br><span class="organizer-event-sub">${e.managementSource==='club_event'?'Club event':e.managementSource==='created_by_you'?'Created by you':'Campus event'}</span></td><td data-label="Actions"><div class="organizer-event-actions"><a class="btn btn-outline btn-sm" href="create-event.html?id=${e.id}">Edit</a><a class="btn btn-outline btn-sm" href="registrations.html?event=${e.id}">Registrations</a><a class="btn btn-outline btn-sm" href="${Api.getOrganizerRegistrationsCsvUrl(e.id)}" target="_blank" rel="noopener">Export CSV</a><a class="btn btn-primary btn-sm" href="${e.registrationForm?.enabled ? `../smart-form.html?event=${encodeURIComponent(e.id)}` : `../event-form.html?id=${encodeURIComponent(e.id)}`}" target="_blank" rel="noopener">Smart Form</a><button class="btn btn-outline btn-sm" data-register-share="${e.id}">Copy registration link</button><button class="btn btn-outline btn-sm" data-share="${e.id}">Share</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="organizer-events-empty"><strong>No events yet</strong>Your campus event registry is empty.</td></tr>';document.querySelectorAll('[data-register-share]').forEach(btn=>btn.onclick=async()=>{const e=events.find(x=>x.id===btn.dataset.registerShare);if(!e)return;try{const r=await shareRegistrationLink(e);showToast(r==='shared'?'Registration share sheet opened.':'Smart registration link copied.')}catch(err){showAlert(alertBox,'Could not share registration link.')}});document.querySelectorAll('[data-share]').forEach(btn=>btn.onclick=async()=>{const e=events.find(x=>x.id===btn.dataset.share);if(!e)return;try{const r=await shareEvent(e);showToast(r==='shared'?'Share sheet opened.':'Event link copied.')}catch(err){showAlert(alertBox,'Could not share event.')}})}catch(e){showAlert(alertBox,e.message)}}load();</script></body></html>
