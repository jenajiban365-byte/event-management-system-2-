<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer Events - EventHub</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="navbar" class="navbar"></div><main class="container"><div class="page-header"><div><span class="eyebrow">ORGANIZER</span><h1>Your Events</h1><p>Build campus events and send them to admin approval.</p></div><button class="btn btn-primary" id="newBtn">Create event</button></div><div id="alertBox"></div><div id="formWrap" class="card hidden" style="margin-bottom:28px"><h2 id="formTitle">Create event</h2><form id="eventForm" class="form-grid"><div class="form-group"><label>Club</label><select id="clubId" class="form-control" required></select></div><div class="form-group"><label>Title</label><input id="title" class="form-control" required></div><div class="form-group full"><label>Description</label><textarea id="description" class="form-control" rows="4" required></textarea></div><div class="form-group"><label>Category</label><input id="category" class="form-control" placeholder="AI, Coding, Cultural..." required></div><div class="form-group"><label>Event type</label><select id="eventType" class="form-control"><option value="event">Event</option><option value="workshop">Workshop</option><option value="conference">Conference</option><option value="competition">Competition</option><option value="seminar">Seminar</option><option value="fest">Fest</option><option value="sports">Sports</option></select></div><div class="form-group"><label>Date</label><input id="date" type="date" class="form-control" required></div><div class="form-group"><label>Time</label><input id="time" type="time" class="form-control" required></div><div class="form-group"><label>Registration deadline</label><input id="registrationDeadline" type="date" class="form-control"></div><div class="form-group"><label>Capacity</label><input id="capacity" type="number" min="1" class="form-control" required></div><div class="form-group"><label>Price</label><input id="price" type="number" min="0" class="form-control" value="0"></div><div class="form-group"><label>Eligibility</label><input id="eligibility" class="form-control" value="All students"></div><div class="form-group"><label>Venue</label><input id="location" class="form-control" required></div><div class="form-group"><label>Image URL</label><input id="imageUrl" class="form-control" type="url"></div><div class="form-group full"><label>Approval</label><label><input id="approvalRequired" type="checkbox"> Require organizer approval for registrations</label></div><div class="action-row full"><button type="button" class="btn btn-outline" id="cancelBtn">Cancel</button><button class="btn btn-primary">Submit for approval</button></div></form></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Event</th><th>Club</th><th>Date</th><th>Status</th><th>Registrations</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireOrganizer();renderNavbar('organizer');const formWrap=document.getElementById('formWrap'),form=document.getElementById('eventForm'),body=document.getElementById('body'),alertBox=document.getElementById('alertBox');let clubs=[],events=[];function status(s){const cls={published:'badge-success',pending_approval:'badge-warning',draft:'badge-muted',cancelled:'badge-danger'}[s]||'badge-muted';return `<span class="badge ${cls}">${escapeHtml(s.replace('_',' '))}</span>`}async function init(){try{({clubs}=await Api.getMyClubs());document.getElementById('clubId').innerHTML=clubs.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');await load()}catch(e){showAlert(alertBox,e.message)}}async function load(){const r=await Api.getOrganizerEvents();events=r.events;body.innerHTML=events.length?events.map(e=>`<tr><td><strong>${escapeHtml(e.title)}</strong><br><span class="muted">${escapeHtml(e.category)}</span></td><td>${escapeHtml(e.club?.name||'—')}</td><td>${formatDate(e.date)}</td><td>${status(e.status)}</td><td>${e.bookedCount}/${e.capacity}</td><td><button class="btn btn-outline btn-sm" data-edit="${e.id}">Edit</button> <a class="btn btn-outline btn-sm" href="registrations.html?event=${e.id}">Registrations</a></td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;color:var(--text-muted)">No events yet.</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(events.find(e=>e.id===b.dataset.edit)))}function openEdit(e){formWrap.classList.remove('hidden');document.getElementById('formTitle').textContent='Edit event';form.dataset.id=e?.id||'';for(const k of ['clubId','title','description','category','eventType','date','time','registrationDeadline','capacity','price','eligibility','location','imageUrl']){const el=document.getElementById(k);if(el)el.value=e?.[k]??''}document.getElementById('approvalRequired').checked=!!e?.approvalRequired}document.getElementById('newBtn').onclick=()=>{form.reset();form.dataset.id='';document.getElementById('price').value=0;document.getElementById('eligibility').value='All students';formWrap.classList.remove('hidden')};document.getElementById('cancelBtn').onclick=()=>formWrap.classList.add('hidden');form.onsubmit=async ev=>{ev.preventDefault();const p={clubId:clubId.value,title:title.value.trim(),description:description.value.trim(),category:category.value.trim(),eventType:eventType.value,date:date.value,time:time.value,registrationDeadline:registrationDeadline.value,capacity:capacity.value,price:price.value,eligibility:eligibility.value.trim(),location:location.value.trim(),imageUrl:imageUrl.value.trim(),approvalRequired:approvalRequired.checked};try{if(form.dataset.id)await Api.updateOrganizerEvent(form.dataset.id,p);else await Api.createOrganizerEvent(p);formWrap.classList.add('hidden');await load();}catch(e){showAlert(alertBox,e.message)}};init();</script></body></html>
