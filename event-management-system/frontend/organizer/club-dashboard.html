<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club Admin Dashboard - EventHub</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="navbar" class="navbar"></div>
<main class="container">
  <div id="alertBox"></div>
  <div id="clubHeader"></div>
  <div id="stats" class="grid grid-3" style="margin:20px 0"></div>

  <div class="clubs-nav" role="tablist" aria-label="Club management sections" style="margin-bottom:24px">
    <button class="clubs-nav-btn active" data-section="overview" type="button">Overview</button>
    <button class="clubs-nav-btn" data-section="opportunities" type="button">Recruitment</button>
    <button class="clubs-nav-btn" data-section="applications" type="button">Applications</button>
    <button class="clubs-nav-btn" data-section="announcements" type="button">Announcements</button>
    <button class="clubs-nav-btn" data-section="members" type="button">Members</button>
    <button class="clubs-nav-btn" data-section="events" type="button">Events</button>
  </div>

  <section id="overviewSection" class="dashboard-section">
    <div class="section-title">Club Profile</div>
    <div class="card">
      <form id="clubForm" class="form-grid">
        <div class="form-group full"><label>Description</label><textarea id="description" class="form-control" rows="3"></textarea></div>
        <div class="form-group"><label>Category</label><input id="clubCategory" class="form-control"></div>
        <div class="form-group"><label>Department</label><input id="department" class="form-control"></div>
        <div class="form-group"><label>Logo URL</label><input id="logoUrl" class="form-control"></div>
        <div class="form-group"><label>Cover Image URL</label><input id="coverImage" class="form-control"></div>
        <div class="form-group"><label>Contact Email</label><input id="contactEmail" type="email" class="form-control"></div>
        <div class="form-group"><label>Website</label><input id="website" type="url" class="form-control"></div>
        <div class="form-group"><label>Instagram</label><input id="instagram" type="url" class="form-control"></div>
        <div class="form-group"><label>LinkedIn</label><input id="linkedin" type="url" class="form-control"></div>
        <div class="form-group full"><button class="btn btn-primary">Save Club Profile</button></div>
      </form>
    </div>
  </section>

  <section id="opportunitiesSection" class="dashboard-section hidden">
    <div class="section-title">Create Recruitment Opening</div>
    <div class="card">
      <form id="oppForm" class="form-grid">
        <div class="form-group"><label>Title</label><input id="oppTitle" class="form-control" required></div>
        <div class="form-group"><label>Status</label><select id="oppStatus" class="form-control"><option value="open">Open</option><option value="draft">Draft</option><option value="closed">Closed</option></select></div>
        <div class="form-group full"><label>Description</label><textarea id="oppDescription" class="form-control" rows="3" required></textarea></div>
        <div class="form-group"><label>Requirements</label><textarea id="oppRequirements" class="form-control"></textarea></div>
        <div class="form-group"><label>Eligibility</label><input id="oppEligibility" class="form-control" value="Open to all students"></div>
        <div class="form-group"><label>Departments</label><input id="oppDepartments" class="form-control" placeholder="CSE, ECE"></div>
        <div class="form-group"><label>Years</label><input id="oppYears" class="form-control" placeholder="2nd Year, 3rd Year"></div>
        <div class="form-group"><label>Required skills</label><input id="oppSkills" class="form-control" placeholder="Java, Design"></div>
        <div class="form-group"><label>Positions</label><input id="oppPositions" type="number" min="1" value="1" class="form-control"></div>
        <div class="form-group"><label>Opening date</label><input id="openingDate" type="date" class="form-control"></div>
        <div class="form-group"><label>Closing date</label><input id="closingDate" type="date" class="form-control"></div>
        <div class="form-group full"><label>Custom questions (one per line)</label><textarea id="oppQuestions" class="form-control" rows="4" placeholder="Why do you want to join?\nDescribe a project you built."></textarea></div>
        <div class="form-group full" style="display:flex;gap:20px;align-items:center"><label><input id="resumeRequired" type="checkbox"> Resume required</label><label><input id="portfolioRequired" type="checkbox"> Portfolio required</label></div>
        <div class="form-group full"><button class="btn btn-primary">Create Opening</button></div>
      </form>
    </div>
    <div class="section-title" style="margin-top:30px">Your Recruitment Openings</div>
    <div id="oppList" class="grid grid-2"></div>
  </section>

  <section id="applicationsSection" class="dashboard-section hidden">
    <div class="section-title">Student Applications</div>
    <div class="table-wrap">
      <table class="data-table"><thead><tr><th>Student</th><th>Opportunity</th><th>Department</th><th>Year</th><th>Skills</th><th>Status</th><th>Action</th></tr></thead><tbody id="apps"></tbody></table>
    </div>
  </section>

  <section id="announcementsSection" class="dashboard-section hidden">
    <div class="section-title">Publish Announcement</div>
    <div class="card">
      <form id="annForm" class="form-grid">
        <div class="form-group"><label>Title</label><input id="annTitle" class="form-control" required></div>
        <div class="form-group full"><label>Message</label><textarea id="annContent" class="form-control" rows="3" required></textarea></div>
        <div class="form-group full"><button class="btn btn-primary">Publish Announcement</button></div>
      </form>
    </div>
    <div class="section-title" style="margin-top:30px">Published Announcements</div>
    <div id="announcements" class="grid grid-2"></div>
  </section>

  <section id="membersSection" class="dashboard-section hidden">
    <div class="section-title">Club Members</div>
    <div id="members" class="grid grid-3"></div>
  </section>

  <section id="eventsSection" class="dashboard-section hidden">
    <div class="section-title">Create Club Event</div>
    <div class="card">
      <form id="eventForm" class="form-grid">
        <div class="form-group"><label>Title</label><input id="eventTitle" class="form-control" required></div>
        <div class="form-group"><label>Category</label><input id="eventCategory" class="form-control" placeholder="e.g. Workshop"></div>
        <div class="form-group"><label>Date</label><input id="eventDate" type="date" class="form-control" required></div>
        <div class="form-group"><label>Start time</label><input id="eventTime" type="time" class="form-control" required></div>
        <div class="form-group"><label>End time</label><input id="eventEndTime" type="time" class="form-control"></div>
        <div class="form-group"><label>Location</label><input id="eventLocation" class="form-control" required></div>
        <div class="form-group"><label>Capacity</label><input id="eventCapacity" type="number" min="1" value="100" class="form-control"></div>
        <div class="form-group"><label>Price (₹)</label><input id="eventPrice" type="number" min="0" value="0" class="form-control"></div>
        <div class="form-group full"><label>Image URL</label><input id="eventImageUrl" type="url" class="form-control" placeholder="https://..."></div>
        <div class="form-group full"><label>Description</label><textarea id="eventDescription" class="form-control" rows="3" required></textarea></div>
        <div class="form-group full"><button class="btn btn-primary">Create Club Event</button></div>
      </form>
    </div>
    <div class="section-title" style="margin-top:30px">All Club Events</div>
    <div id="events" class="grid grid-2"></div>
  </section>
</main>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
requireClubHead();
renderClubHeadNavbar('dashboard');

const alertBox = document.getElementById('alertBox');
const sectionButtons = document.querySelectorAll('[data-section]');
const sections = document.querySelectorAll('.dashboard-section');
const csv = value => String(value || '').split(',').map(s => s.trim()).filter(Boolean);
let dashboard = null;

function switchSection(name) {
  sectionButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.section === name));
  sections.forEach(section => section.classList.toggle('hidden', section.id !== `${name}Section`));
  window.location.hash = name;
  if (name === 'opportunities') loadOpportunities();
  if (name === 'applications') loadApplications();
  if (name === 'announcements') loadAnnouncements();
  if (name === 'members') loadMembers();
  if (name === 'events') loadEvents();
}
sectionButtons.forEach(btn => btn.addEventListener('click', () => switchSection(btn.dataset.section)));

function renderHeader(data) {
  const c = data.club;
  document.getElementById('clubHeader').innerHTML = `<div class="page-header"><div><span class="eyebrow">CLUB ADMIN DASHBOARD</span><h1>${escapeHtml(c.name)}</h1><p>${escapeHtml(c.category)} · ${escapeHtml(c.department || 'General / Open')}</p></div><a href="../club-details.html?id=${c.id}" class="btn btn-outline">View Public Club</a></div>`;
  document.getElementById('stats').innerHTML = [
    ['Followers', data.stats.followerCount], ['Members', data.stats.memberCount], ['Pending Applications', data.stats.pendingApplicationsCount],
    ['Recruitment Openings', data.stats.opportunitiesCount], ['Upcoming Events', data.stats.upcomingEventsCount], ['Past Events', data.stats.pastEventsCount]
  ].map(([label,value]) => `<div class="stat-card"><div class="label">${label}</div><div class="value">${Number(value) || 0}</div></div>`).join('');
  document.getElementById('description').value = c.description || '';
  document.getElementById('clubCategory').value = c.category || '';
  document.getElementById('department').value = c.department || '';
  document.getElementById('logoUrl').value = c.logoUrl || '';
  document.getElementById('coverImage').value = c.coverImage || '';
  document.getElementById('contactEmail').value = c.contactEmail || '';
  document.getElementById('website').value = c.socialLinks?.website || '';
  document.getElementById('instagram').value = c.socialLinks?.instagram || '';
  document.getElementById('linkedin').value = c.socialLinks?.linkedin || '';
}

function renderOpps(list) {
  const target = document.getElementById('oppList');
  target.innerHTML = list.length ? list.map(o => `<article class="card">
    <div class="event-card-topline"><span class="badge badge-primary">${escapeHtml(o.status)}</span><span class="muted">${Number(o.numberOfPositions)||1} positions</span></div>
    <h3>${escapeHtml(o.title)}</h3><p>${escapeHtml(o.description || '')}</p>
    <p class="muted">${Number(o.totalApplications)||0} applications · ${Number(o.pendingApplications)||0} pending</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-danger btn-sm" data-delete-opp="${o.id || o._id}">Delete</button></div>
  </article>`).join('') : '<div class="empty-state"><p>No recruitment openings yet. Create the first one above.</p></div>';
  target.querySelectorAll('[data-delete-opp]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Delete this recruitment opening?')) return;
    try { await Api.deleteClubHeadOpportunity(btn.dataset.deleteOpp); showToast('Recruitment opening deleted.'); await loadAll(); }
    catch (err) { showAlert(alertBox, err.message); }
  });
}

async function loadOpportunities() {
  try { const res = await Api.getClubHeadOpportunities(); renderOpps(res.opportunities || []); }
  catch (err) { showAlert(alertBox, err.message); }
}

async function loadApplications() {
  try {
    const res = await Api.getClubHeadApplications();
    const body = document.getElementById('apps');
    body.innerHTML = res.applications?.length ? res.applications.map(a => `<tr>
      <td>${escapeHtml(a.student?.name || a.name || '')}<br><span class="muted">${escapeHtml(a.email || a.student?.email || '')}</span></td>
      <td>${escapeHtml(a.opportunity?.title || '')}</td><td>${escapeHtml(a.department || '')}</td><td>${escapeHtml(a.year || '')}</td>
      <td>${escapeHtml((a.skills || []).join(', '))}</td><td>${escapeHtml(a.status || '')}</td>
      <td>${a.status === 'pending' ? `<button class="btn btn-primary btn-sm" data-app="${a.id}" data-status="accepted">Accept</button> <button class="btn btn-danger btn-sm" data-app="${a.id}" data-status="rejected">Reject</button>` : '—'}</td>
    </tr>`).join('') : '<tr><td colspan="7">No applications yet.</td></tr>';
    body.querySelectorAll('[data-app]').forEach(btn => btn.onclick = async () => {
      try { await Api.updateClubHeadApplication(btn.dataset.app, btn.dataset.status); showToast(`Application ${btn.dataset.status}.`); await loadAll(); }
      catch (err) { showAlert(alertBox, err.message); }
    });
  } catch (err) { showAlert(alertBox, err.message); }
}

async function loadAnnouncements() {
  try {
    const res = await Api.getClubHeadAnnouncements();
    const target = document.getElementById('announcements');
    target.innerHTML = res.announcements?.length ? res.announcements.map(a => `<article class="card"><h3>${escapeHtml(a.title)}</h3><p>${escapeHtml(a.content)}</p><small class="muted">${formatDateTime(a.createdAt)}</small><div style="margin-top:12px"><button class="btn btn-danger btn-sm" data-delete-ann="${a.id || a._id}">Delete</button></div></article>`).join('') : '<div class="empty-state"><p>No announcements yet.</p></div>';
    target.querySelectorAll('[data-delete-ann]').forEach(btn => btn.onclick = async () => {
      if (!confirm('Delete this announcement?')) return;
      try { await fetchDeleteAnnouncement(btn.dataset.deleteAnn); await loadAll(); showToast('Announcement deleted.'); }
      catch (err) { showAlert(alertBox, err.message); }
    });
  } catch (err) { showAlert(alertBox, err.message); }
}
async function fetchDeleteAnnouncement(id) { return Api.deleteClubHeadAnnouncement(id); }

async function loadMembers() {
  try {
    const res = await Api.getClubHeadMembers();
    const target = document.getElementById('members');
    target.innerHTML = res.members?.length ? res.members.map(m => `<article class="card"><h3>${escapeHtml(m.name)}</h3><p>${escapeHtml(m.email || '')}</p><p class="muted">${escapeHtml(m.department || '')} ${m.year ? '· ' + escapeHtml(m.year) : ''}</p></article>`).join('') : '<div class="empty-state"><p>No members yet.</p></div>';
  } catch (err) { showAlert(alertBox, err.message); }
}

function renderEvents(list) {
  const target = document.getElementById('events');
  target.innerHTML = list.length ? list.map(e => `<article class="card">
    <div class="event-card-topline"><span class="badge badge-primary">${escapeHtml(e.category || 'Event')}</span><span class="muted">${escapeHtml(e.date)} ${escapeHtml(e.time || '')}${e.endTime ? '–' + escapeHtml(e.endTime) : ''}</span></div>
    <h3>${escapeHtml(e.title)}</h3><p>📍 ${escapeHtml(e.location)}</p><p>${escapeHtml(e.description || '')}</p>
    <p class="muted">${Number(e.bookedCount)||0}/${Number(e.capacity)||0} booked · ${Number(e.price || 0) === 0 ? 'Free' : '₹' + Number(e.price)}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><a href="../event-details.html?id=${e.id}" class="btn btn-outline btn-sm">View Event</a><button class="btn btn-danger btn-sm" data-delete-event="${e.id}">Delete</button></div>
  </article>`).join('') : '<div class="empty-state"><p>No club events yet. Create an event above.</p></div>';
  target.querySelectorAll('[data-delete-event]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Delete this club event? Existing bookings will not be restored.')) return;
    try { await Api.deleteClubHeadEvent(btn.dataset.deleteEvent); showToast('Event deleted.'); await loadAll(); }
    catch (err) { showAlert(alertBox, err.message); }
  });
}
async function loadEvents() {
  try { const res = await Api.getClubHeadEvents(); renderEvents(res.events || []); }
  catch (err) { showAlert(alertBox, err.message); }
}

async function loadAll() {
  try {
    dashboard = await Api.getClubHeadDashboard();
    renderHeader(dashboard);
    await Promise.all([loadOpportunities(), loadApplications(), loadAnnouncements(), loadMembers(), loadEvents()]);
  } catch (err) { showAlert(alertBox, err.message); }
}

document.getElementById('clubForm').onsubmit = async event => {
  event.preventDefault();
  try {
    await Api.updateClubHeadClub({
      description: description.value, category: clubCategory.value, department: department.value,
      logoUrl: logoUrl.value, coverImage: coverImage.value, contactEmail: contactEmail.value,
      socialLinks: { website: website.value, instagram: instagram.value, linkedin: linkedin.value }
    });
    showToast('Club profile updated.'); await loadAll();
  } catch (err) { showAlert(alertBox, err.message); }
};

document.getElementById('oppForm').onsubmit = async event => {
  event.preventDefault();
  try {
    await Api.createClubHeadOpportunity({
      title: oppTitle.value.trim(), description: oppDescription.value.trim(), requirements: oppRequirements.value.trim(),
      eligibility: oppEligibility.value.trim(), departments: csv(oppDepartments.value), years: csv(oppYears.value), requiredSkills: csv(oppSkills.value),
      numberOfPositions: Number(oppPositions.value), openingDate: openingDate.value, closingDate: closingDate.value,
      customQuestions: oppQuestions.value.split('\n').map(q => q.trim()).filter(Boolean).map(question => ({ question, required:true })),
      resumeRequired: resumeRequired.checked, portfolioRequired: portfolioRequired.checked, status: oppStatus.value
    });
    event.target.reset(); oppStatus.value='open'; oppPositions.value=1; showToast('Recruitment opening created.'); await loadAll();
  } catch (err) { showAlert(alertBox, err.message); }
};

document.getElementById('annForm').onsubmit = async event => {
  event.preventDefault();
  try { await Api.createClubHeadAnnouncement({ title: annTitle.value.trim(), content: annContent.value.trim() }); event.target.reset(); showToast('Announcement published.'); await loadAll(); }
  catch (err) { showAlert(alertBox, err.message); }
};

document.getElementById('eventForm').onsubmit = async event => {
  event.preventDefault();
  try {
    await Api.createClubHeadEvent({
      title: eventTitle.value.trim(), category: eventCategory.value.trim(), date: eventDate.value,
      time: eventTime.value, endTime: eventEndTime.value, location: eventLocation.value.trim(),
      capacity: Number(eventCapacity.value), price: Number(eventPrice.value), imageUrl: eventImageUrl.value.trim(), description: eventDescription.value.trim()
    });
    event.target.reset(); eventCapacity.value=100; eventPrice.value=0; showToast('Club event created and published.'); await loadAll();
  } catch (err) { showAlert(alertBox, err.message); }
};

const initialSection = ['overview','opportunities','applications','announcements','members','events'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
switchSection(initialSection);
loadAll();
</script>
</body>
</html>
