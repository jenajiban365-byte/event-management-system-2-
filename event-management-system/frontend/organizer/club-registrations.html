<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Registrations — EventHub</title><link rel="stylesheet" href="../css/style.css?v=38">
<link rel="stylesheet" href="../css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="../css/mobile-polish.css?v=52">
<link rel="stylesheet" href="../css/eventhub-v61.css?v=61">
  <link rel="stylesheet" href="../css/mobile-v63.css?v=63.1">
</head><body><div id="navbar" class="navbar"></div><main class="container"><div class="page-header"><div><span class="eyebrow">CLUB HEAD</span><h1 id="title">Registrations</h1><p id="meta">Loading…</p></div><a id="csv" class="btn btn-primary">Export CSV</a></div><div id="alertBox"></div><div id="stats" class="grid grid-4" style="margin:18px 0"></div><div class="table-wrap"><table class="data-table"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireClubHead();renderClubHeadNavbar('events');const id=new URLSearchParams(location.search).get('event');const esc=window.escapeHtml||(v=>String(v??''));const alertBox=document.getElementById('alertBox');async function init(){if(!id){showAlert(alertBox,'Missing event.');return}try{const r=await Api.getClubHeadRegistrations(id);const e=r.event,b=r.bookings||[];document.getElementById('title').textContent=e.title;document.getElementById('meta').textContent=`${formatDate(e.date)} · ${e.time} · ${b.length}/${e.capacity} registrations`;document.getElementById('stats').innerHTML=[['Registrations',b.length],['Capacity',e.capacity],['Confirmed',b.filter(x=>x.status==='confirmed').length],['Checked in',b.filter(x=>x.checkedInAt).length]].map(x=>`<div class="card stat-card"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('');const questions=[...new Set((e.customRegistrationQuestions||[]).map(q=>q.question).filter(Boolean))];document.getElementById('thead').innerHTML=`<tr><th>Student</th><th>Email</th><th>Department</th><th>Year</th>${questions.map(q=>`<th>${esc(q)}</th>`).join('')}<th>Status</th><th>Attendance</th></tr>`;document.getElementById('tbody').innerHTML=b.length?b.map(x=>{const m=Object.fromEntries((x.registrationAnswers||[]).map(a=>[a.question,a.answer]));return `<tr><td><strong>${esc(x.user?.name||'Unknown')}</strong><br><span class="muted">${esc(x.user?.studentId||'')}</span></td><td>${esc(x.user?.email||'')}</td><td>${esc(x.user?.department||'—')}</td><td>${esc(x.user?.year||'—')}</td>${questions.map(q=>`<td>${esc(m[q]||'—')}</td>`).join('')}<td>${esc(x.status)}</td><td>${x.checkedInAt?'<span class="badge badge-success">Checked in</span>':'—'}</td></tr>`}).join(''):`<tr><td colspan="${7+questions.length}">No registrations yet.</td></tr>`;document.getElementById('csv').href=Api.getClubHeadRegistrationsCsvUrl(id);}catch(e){showAlert(alertBox,e.message)}}init();</script></body></html>
