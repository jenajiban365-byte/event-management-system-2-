<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check In - EventHub</title><link rel="stylesheet" href="../css/style.css?v=37"><script src="https://unpkg.com/html5-qrcode" defer></script>
<link rel="stylesheet" href="../css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="../css/mobile-polish.css?v=52">
<link rel="stylesheet" href="../css/eventhub-v61.css?v=61">
  <link rel="stylesheet" href="../css/mobile-v63.css?v=63.1">
</head><body><div id="navbar" class="navbar"></div><main class="container" style="max-width:760px"><div class="page-header"><div><span class="eyebrow">EVENT DAY</span><h1>Check in attendees</h1><p>Scan the student's EventHub QR pass or enter the registration code.</p></div></div><div id="alertBox"></div><div class="card"><div id="qr-reader" style="max-width:520px;margin:0 auto 22px"></div><div class="action-row" style="justify-content:center;margin-bottom:18px"><button type="button" class="btn btn-outline" id="startScanner">Scan QR with camera</button><button type="button" class="btn btn-outline" id="stopScanner" style="display:none">Stop camera</button></div><form id="form"><div class="form-group"><label for="code">Registration code</label><input id="code" class="form-control" placeholder="Example: A4F19C82D1" autocomplete="off" required></div><button class="btn btn-primary" style="width:100%">Verify & check in</button></form><div id="result" style="margin-top:22px"></div></div></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>const checkInUser=Session.getUser();
if(!Session.isLoggedIn() || !['organizer','admin','club_head'].includes(checkInUser?.role)){window.location.href='../login.html';}
if(checkInUser?.role==='club_head') renderClubHeadNavbar('check-in'); else renderOrganizerNavbar('check-in');const form=document.getElementById('form'),code=document.getElementById('code'),result=document.getElementById('result'),alertBox=document.getElementById('alertBox');let scanner=null;async function verify(value){code.value=value;clearAlert(alertBox);result.innerHTML='';try{const {booking}=await Api.checkInAttendee(value);result.innerHTML=`<div class="card" style="border-color:var(--success)"><h2>✓ Check-in successful</h2><p><strong>${escapeHtml(booking.user?.name||'Attendee')}</strong> is checked in for <strong>${escapeHtml(booking.event?.title||'the event')}</strong>.</p><p class="muted">${escapeHtml(booking.user?.email||'')}</p></div>`;form.reset();if(scanner){await scanner.stop().catch(()=>{});document.getElementById('stopScanner').style.display='none';}}catch(err){showAlert(alertBox,err.message)}};form.onsubmit=async e=>{e.preventDefault();await verify(code.value)};document.getElementById('startScanner').onclick=async()=>{try{if(!window.Html5Qrcode)throw new Error('QR scanner is still loading. Please try again.');scanner=new Html5Qrcode('qr-reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},async decoded=>{await verify(decoded)},()=>{});document.getElementById('startScanner').style.display='none';document.getElementById('stopScanner').style.display='inline-flex'}catch(err){showAlert(alertBox,err.message)}};document.getElementById('stopScanner').onclick=async()=>{if(scanner){await scanner.stop().catch(()=>{});scanner=null}document.getElementById('startScanner').style.display='inline-flex';document.getElementById('stopScanner').style.display='none'};</script></body></html>
