<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check In - EventHub</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="navbar" class="navbar"></div><main class="container" style="max-width:760px"><div class="page-header"><div><span class="eyebrow">EVENT DAY</span><h1>Check in attendees</h1><p>Enter the registration pass code shown on the student's EventHub booking pass.</p></div></div><div id="alertBox"></div><div class="card"><form id="form"><div class="form-group"><label for="code">Registration code</label><input id="code" class="form-control" placeholder="Example: A4F19C82D1" autocomplete="off" required></div><button class="btn btn-primary" style="width:100%">Verify & check in</button></form><div id="result" style="margin-top:22px"></div></div></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireOrganizer();renderNavbar('organizer');const form=document.getElementById('form'),code=document.getElementById('code'),result=document.getElementById('result'),alertBox=document.getElementById('alertBox');form.onsubmit=async e=>{e.preventDefault();clearAlert(alertBox);result.innerHTML='';try{const {booking}=await Api.checkInAttendee(code.value);result.innerHTML=`<div class="card" style="border-color:var(--success)"><h2>✓ Check-in successful</h2><p><strong>${escapeHtml(booking.user?.name||'Attendee')}</strong> is checked in for <strong>${escapeHtml(booking.event?.title||'the event')}</strong>.</p><p class="muted">${escapeHtml(booking.user?.email||'')}</p></div>`;form.reset();}catch(err){showAlert(alertBox,err.message)}};</script></body></html>
