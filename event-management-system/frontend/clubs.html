<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clubs - EventHub</title><link rel="stylesheet" href="css/style.css"></head><body><div id="navbar" class="navbar"></div><main class="container"><div class="page-header"><div><span class="eyebrow">CAMPUS COMMUNITY</span><h1>Clubs & societies</h1><p>Discover the student communities creating campus events.</p></div><button class="btn btn-outline" id="request">Request a club</button></div><div id="alertBox"></div><div id="requestBox" class="card hidden" style="margin-bottom:20px"><h2>Request a club</h2><form id="form" class="form-grid"><div class="form-group"><label>Club name</label><input id="name" class="form-control" required></div><div class="form-group"><label>Category</label><input id="category" class="form-control" placeholder="Technical, Cultural, Sports..."></div><div class="form-group full"><label>Description</label><textarea id="description" class="form-control" rows="3"></textarea></div><div class="form-group full"><button class="btn btn-primary">Submit for approval</button></div></form></div><div id="clubs" class="grid grid-3"></div></main><script src="js/api.js"></script><script src="js/nav.js"></script><script>renderNavbar('clubs');const box=document.getElementById('clubs'),alertBox=document.getElementById('alertBox');async function load(){try{const{clubs}=await Api.getClubs();box.innerHTML=clubs.length?clubs.map(c=>`<article class="card"><div class="event-card-topline"><span class="badge badge-primary">${escapeHtml(c.category)}</span><span class="muted">${c.followerCount} followers</span></div><h2>${escapeHtml(c.name)}</h2><p>${escapeHtml(c.description||'Campus club')}</p>${Session.isLoggedIn()?`<button class="btn btn-outline" data-follow="${c.id}">Follow / unfollow</button>`:''}</article>`).join(''):`<div class="empty-state" style="grid-column:1/-1"><h3>No approved clubs yet</h3><p>Club requests will appear here after college approval.</p></div>`;document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{try{await Api.toggleClubFollow(b.dataset.follow);load()}catch(e){showAlert(alertBox,e.message)}})}catch(e){showAlert(alertBox,e.message)}}document.getElementById('request').onclick=()=>{if(!Session.isLoggedIn()){location.href='login.html';return}document.getElementById('requestBox').classList.toggle('hidden')};document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{await Api.requestClub({name:name.value,category:category.value,description:description.value});showAlert(alertBox,'Club request sent to the college admin.','success');e.target.reset();requestBox.classList.add('hidden')}catch(err){showAlert(alertBox,err.message)}};load();</script></body></html>
