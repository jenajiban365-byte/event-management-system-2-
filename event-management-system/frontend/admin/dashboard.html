<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard - EventHub</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <div class="page-header">
    <div>
      <h1>Dashboard</h1>
      <p>Overview of your events, users and bookings.</p>
    </div>
  </div>

  <div id="alertBox"></div>
  <div id="statsGrid" class="grid grid-3" style="margin-bottom:32px;"></div>

  <div class="section-title">Bookings — Last 14 Days</div>
  <div class="card admin-chart-card" style="margin-bottom:28px;"><div id="bookingChart" class="admin-booking-chart"></div></div>

  <div class="section-title">Recent Bookings</div>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>User</th><th>Event</th><th>Status</th><th>Booked On</th></tr>
      </thead>
      <tbody id="recentBookingsBody"></tbody>
    </table>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
  requireAdmin();
  renderAdminNavbar('dashboard');

  const alertBox = document.getElementById('alertBox');
  const statsGrid = document.getElementById('statsGrid');
  const recentBookingsBody = document.getElementById('recentBookingsBody');

  function renderChart(trend) {
    const max = Math.max(1, ...trend.map((d) => d.count));
    const width = 760, height = 220, pad = 28;
    const points = trend.map((d, i) => { const x = pad + i * ((width - pad * 2) / Math.max(1, trend.length - 1)); const y = height - pad - (d.count / max) * (height - pad * 2); return `${x},${y}`; }).join(' ');
    document.getElementById('bookingChart').innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="220" preserveAspectRatio="none" role="img" aria-label="Bookings over the last 14 days"><line x1="${pad}" y1="${height-pad}" x2="${width-pad}" y2="${height-pad}" stroke="currentColor" opacity=".2"/><polyline points="${points}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${trend.map((d,i)=>{const x=pad+i*((width-pad*2)/Math.max(1,trend.length-1));const y=height-pad-(d.count/max)*(height-pad*2);return `<circle cx="${x}" cy="${y}" r="4" fill="currentColor"><title>${escapeHtml(d.date)}: ${d.count} bookings</title></circle>`}).join('')}</svg>`;
  }

  function statusBadge(status) {
    const map = { confirmed: 'badge-success', pending: 'badge-warning', cancelled: 'badge-muted', rejected: 'badge-danger' };
    return `<span class="badge ${map[status] || 'badge-muted'}">${status}</span>`;
  }

  async function load() {
    try {
      clearAlert(alertBox);
      const { totals, recentBookings, bookingTrend } = await Api.getDashboard();
      renderChart(bookingTrend || []);

      statsGrid.innerHTML = `
        <div class="stat-card"><div class="label">Total Events</div><div class="value">${totals.totalEvents}</div></div>
        <div class="stat-card"><div class="label">Upcoming Events</div><div class="value">${totals.upcomingEvents}</div></div>
        <div class="stat-card"><div class="label">Total Users</div><div class="value">${totals.totalUsers}</div></div>
        <div class="stat-card"><div class="label">Total Bookings</div><div class="value">${totals.totalBookings}</div></div>
        <div class="stat-card"><div class="label">Active Bookings</div><div class="value">${totals.activeBookings}</div></div>
        <div class="stat-card"><div class="label">Total Clubs</div><div class="value">${totals.totalClubs}</div></div>
        <div class="stat-card"><div class="label">Club Heads</div><div class="value">${totals.totalClubHeads}</div></div>
        <div class="stat-card"><div class="label">Pending Club Requests</div><div class="value">${totals.pendingClubRequests}</div></div>
        <div class="stat-card"><div class="label">Pending Event Approvals</div><div class="value">${totals.pendingEvents}</div></div>
      `;

      recentBookingsBody.innerHTML = recentBookings.length
        ? recentBookings.map((b) => `
            <tr>
              <td>${escapeHtml(b.userName)}</td>
              <td>${escapeHtml(b.eventTitle)}</td>
              <td>${statusBadge(b.status)}</td>
              <td>${formatDateTime(b.createdAt)}</td>
            </tr>
          `).join('')
        : `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No bookings yet.</td></tr>`;
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  }

  load();
</script>
</body>
</html>
