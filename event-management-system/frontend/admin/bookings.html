<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>All Bookings - EventHub Admin</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <div class="page-header">
    <div>
      <h1>All Bookings</h1>
      <p>View every registration and approve, reject, or cancel as needed.</p>
    </div>
  </div>

  <div class="filters-bar">
    <select id="statusFilter" class="form-control">
      <option value="">All Statuses</option>
      <option value="confirmed">Confirmed</option>
      <option value="pending">Pending</option>
      <option value="cancelled">Cancelled</option>
      <option value="rejected">Rejected</option>
    </select>
  </div>

  <div id="alertBox"></div>

  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>User</th><th>Email</th><th>Event</th><th>Status</th><th>Booked On</th><th>Actions</th></tr>
      </thead>
      <tbody id="bookingsBody"></tbody>
    </table>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
  requireAdmin();
  renderAdminNavbar('bookings');

  const alertBox = document.getElementById('alertBox');
  const bookingsBody = document.getElementById('bookingsBody');
  const statusFilter = document.getElementById('statusFilter');

  let bookingsCache = [];

  function statusBadge(status) {
    const map = { confirmed: 'badge-success', pending: 'badge-warning', cancelled: 'badge-muted', rejected: 'badge-danger' };
    return `<span class="badge ${map[status] || 'badge-muted'}">${status}</span>`;
  }

  function renderBookings() {
    const filtered = statusFilter.value
      ? bookingsCache.filter((b) => b.status === statusFilter.value)
      : bookingsCache;

    if (!filtered.length) {
      bookingsBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No bookings found.</td></tr>`;
      return;
    }

    bookingsBody.innerHTML = filtered.map((b) => `
      <tr>
        <td>${escapeHtml(b.user ? b.user.name : 'Deleted user')}</td>
        <td>${escapeHtml(b.user ? b.user.email : '-')}</td>
        <td>${escapeHtml(b.event ? b.event.title : 'Deleted event')}</td>
        <td>${statusBadge(b.status)}</td>
        <td>${formatDateTime(b.createdAt)}</td>
        <td>
          <div class="action-row">
            ${b.status !== 'confirmed' ? `<button class="btn btn-outline btn-sm" data-status="${b.id}" data-value="confirmed">Approve</button>` : ''}
            ${b.status !== 'rejected' ? `<button class="btn btn-outline btn-sm" data-status="${b.id}" data-value="rejected">Reject</button>` : ''}
            ${b.status !== 'cancelled' ? `<button class="btn btn-danger btn-sm" data-status="${b.id}" data-value="cancelled">Cancel</button>` : ''}
          </div>
        </td>
      </tr>
    `).join('');

    document.querySelectorAll('[data-status]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        try {
          await Api.updateBookingStatus(btn.getAttribute('data-status'), btn.getAttribute('data-value'));
          load();
        } catch (err) {
          showAlert(alertBox, err.message);
        }
      });
    });
  }

  async function load() {
    try {
      clearAlert(alertBox);
      const { bookings } = await Api.getAllBookings();
      bookingsCache = bookings;
      renderBookings();
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  }

  statusFilter.addEventListener('change', renderBookings);

  load();
</script>
</body>
</html>
