<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Approvals - EventHub Admin</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="navbar" class="navbar"></div><main class="container"><div class="page-header"><div><span class="eyebrow">COLLEGE ADMIN</span><h1>Event approvals</h1><p>Review events submitted by clubs before they go live to students.</p></div></div><div id="alertBox"></div><div id="cards" class="grid grid-2"></div></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireAdmin();renderAdminNavbar('approvals');const cards=document.getElementById('cards'),alertBox=document.getElementById('alertBox');async function load(){try{const {events}=await Api.getPendingEvents();cards.innerHTML=events.length?events.map(e=>`<article class="card"><span class="badge badge-warning">Pending approval</span><h2>${escapeHtml(e.title)}</h2><p class="muted">${escapeHtml(e.club?.name||'No club')} · ${escapeHtml(e.organizer?.name||'Unknown organizer')}</p><p>${escapeHtml(e.description)}</p><div class="event-meta"><span>📅 ${formatDate(e.date)} · ${escapeHtml(e.time)}</span><span>📍 ${escapeHtml(e.location)}</span><span>👥 ${e.capacity} seats</span></div><div class="action-row" style="margin-top:20px"><button class="btn btn-primary" data-approve="${e.id}">Approve & publish</button><button class="btn btn-danger" data-reject="${e.id}">Reject</button></div></article>`).join(''):'<div class="card"><h2>All clear</h2><p class="muted">No event approvals are waiting.</p></div>';document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{try{await Api.approveEvent(b.dataset.approve,'published');load()}catch(e){showAlert(alertBox,e.message)}});document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{try{await Api.approveEvent(b.dataset.reject,'draft');load()}catch(e){showAlert(alertBox,e.message)}})}catch(e){showAlert(alertBox,e.message)}}load();</script></body></html>
