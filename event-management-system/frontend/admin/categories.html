<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Categories - EventHub Admin</title>
<link rel="stylesheet" href="../css/style.css?v=37" />

<link rel="stylesheet" href="../css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="../css/mobile-polish.css?v=52">
<link rel="stylesheet" href="../css/eventhub-v61.css?v=61">
  <link rel="stylesheet" href="../css/mobile-v63.css?v=63.1">
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container" style="max-width:700px;">
  <div class="page-header">
    <div>
      <h1>Event Categories</h1>
      <p>Manage the categories events can be tagged with.</p>
    </div>
  </div>

  <div class="card" style="margin-bottom:24px;">
    <div id="alertBox"></div>
    <form id="categoryForm" style="display:flex; gap:10px;">
      <input type="text" id="categoryName" class="form-control" placeholder="New category name (e.g. Webinar)" required />
      <button type="submit" class="btn btn-primary" style="white-space:nowrap;">Add Category</button>
    </form>
  </div>

  <div class="table-wrap">
    <table class="data-table">
      <thead><tr><th>#</th><th>Category Name</th><th>Actions</th></tr></thead>
      <tbody id="categoriesBody"></tbody>
    </table>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
  requireAdmin();
  renderAdminNavbar('categories');

  const alertBox = document.getElementById('alertBox');
  const categoriesBody = document.getElementById('categoriesBody');
  const categoryForm = document.getElementById('categoryForm');

  async function loadCategories() {
    try {
      clearAlert(alertBox);
      const { categories } = await Api.getCategories();
      categoriesBody.innerHTML = categories.length
        ? categories.map((c, i) => `
            <tr>
              <td>${i + 1}</td>
              <td><span id="cat-name-${c.id}">${escapeHtml(c.name)}</span></td>
              <td>
                <div class="action-row">
                  <button class="btn btn-outline btn-sm" data-rename="${c.id}" data-current="${escapeHtml(c.name)}">Rename</button>
                  <button class="btn btn-danger btn-sm" data-delete="${c.id}">Delete</button>
                </div>
              </td>
            </tr>
          `).join('')
        : `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">No categories yet.</td></tr>`;

      document.querySelectorAll('[data-rename]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const newName = prompt('New category name:', btn.getAttribute('data-current'));
          if (!newName || !newName.trim()) return;
          try {
            await Api.updateCategory(btn.getAttribute('data-rename'), { name: newName.trim() });
            loadCategories();
          } catch (err) {
            showAlert(alertBox, err.message);
          }
        });
      });
      document.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this category? Existing events keep their category text but it will no longer appear in the filter list.')) return;
          try {
            await Api.deleteCategory(btn.getAttribute('data-delete'));
            loadCategories();
          } catch (err) {
            showAlert(alertBox, err.message);
          }
        });
      });
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  }

  categoryForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const nameInput = document.getElementById('categoryName');
    try {
      await Api.createCategory({ name: nameInput.value.trim() });
      nameInput.value = '';
      loadCategories();
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  });

  loadCategories();
</script>
</body>
</html>
