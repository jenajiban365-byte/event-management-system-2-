<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Inbox - EventHub</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="navbar" class="navbar"></div><main class="container" style="max-width:950px"><div class="page-header"><div><span class="eyebrow">STAFF INBOX</span><h1>Student questions</h1><p>Reply here instead of moving the conversation to email.</p></div></div><div id="alertBox"></div><div id="tickets"></div></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireAuth();renderAdminNavbar('support');const box=document.getElementById('tickets'),alertBox=document.getElementById('alertBox');async function load(){try{const{tickets}=await Api.getSupportTickets();box.innerHTML=tickets.length?tickets.map(t=>`<article class="card" style="margin-bottom:16px"><div class="event-card-topline"><div><strong>${escapeHtml(t.subject)}</strong><p class="muted">${escapeHtml(t.name)} · ${escapeHtml(t.email)}</p></div><span class="badge ${t.status==='resolved'?'badge-success':'badge-warning'}">${t.status}</span></div>${t.messages.map(m=>`<div style="padding:10px 0;border-top:1px solid var(--border)"><strong>${escapeHtml(m.senderName)}</strong><p style="margin:5px 0;white-space:pre-wrap">${escapeHtml(m.body)}</p></div>`).join('')}<textarea class="form-control" rows="3" data-text="${t.id}" placeholder="Write a reply for ${escapeHtml(t.name)}"></textarea><div class="action-row" style="margin-top:10px"><button class="btn btn-primary" data-reply="${t.id}">Send reply</button><button class="btn btn-outline" data-resolve="${t.id}">Mark resolved</button></div></article>`).join(''):`<div class="empty-state"><h3>Inbox clear</h3><p>No student questions yet.</p></div>`;document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=async()=>{try{const message=document.querySelector(`[data-text="${b.dataset.reply}"]`).value.trim();await Api.replyToSupportTicket(b.dataset.reply,message);load()}catch(e){showAlert(alertBox,e.message)}});document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=async()=>{await Api.updateSupportTicket(b.dataset.resolve,'resolved');load()})}catch(e){showAlert(alertBox,e.message)}}load();</script></body></html>
