<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clubs - EventHub Admin</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="navbar" class="navbar"></div><main class="container"><div id="alertBox"></div><div class="page-header"><div><span class="eyebrow">COLLEGE ADMIN</span><h1>Club Management</h1><p>Create clubs, review requests and assign Club Heads.</p></div></div><div class="card" style="margin-bottom:20px"><h2>Create Club</h2><form id="createForm" class="form-grid"><div class="form-group"><label>Name</label><input id="cName" class="form-control" required></div><div class="form-group"><label>Short Name</label><input id="cShort" class="form-control"></div><div class="form-group"><label>Category</label><input id="cCategory" class="form-control" required></div><div class="form-group"><label>Department</label><input id="cDepartment" class="form-control"></div><div class="form-group full"><label>Description</label><textarea id="cDescription" class="form-control"></textarea></div><div class="form-group"><label>Logo URL</label><input id="cLogo" class="form-control"></div><div class="form-group"><label>Cover Image URL</label><input id="cCover" class="form-control"></div><div class="form-group full"><button class="btn btn-primary">Create Club</button></div></form></div><div class="section-title">Pending Club Requests</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Proposed Club</th><th>Requester</th><th>Category</th><th>Status</th><th>Action</th></tr></thead><tbody id="requests"></tbody></table></div><div class="section-title" style="margin-top:30px">Clubs & Club Heads</div><div id="clubs" class="grid grid-2"></div></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireAdmin();renderAdminNavbar('clubs');const alertBox=document.getElementById('alertBox');async function load(){try{const [cr,cl]=await Promise.all([Api.getClubRequests(),Api.getAdminClubs()]);requests.innerHTML=cr.requests.length?cr.requests.map(r=>`<tr><td><strong>${escapeHtml(r.proposedName)}</strong><br><span class="muted">${escapeHtml(r.description)}</span></td><td>${escapeHtml(r.requestedBy?.name||'')}<br>${escapeHtml(r.requestedBy?.email||'')}</td><td>${escapeHtml(r.category)}</td><td>${escapeHtml(r.status)}</td><td>${r.status==='pending'?`<button class="btn btn-primary btn-sm" data-approve="${r.id}">Approve</button> <button class="btn btn-danger btn-sm" data-reject="${r.id}">Reject</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="5">No club requests.</td></tr>';clubs.innerHTML=cl.clubs.map(c=>`<article class="card"><div class="event-card-topline"><span class="badge ${c.status==='active'?'badge-success':'badge-warning'}">${escapeHtml(c.status)}</span><span>${(c.clubHeads||[]).length} heads</span></div><h2>${escapeHtml(c.name)}</h2><p>${escapeHtml(c.category)} · ${escapeHtml(c.department||'')}</p><p>${escapeHtml(c.description||'')}</p><div>${(c.clubHeads||[]).map(h=>`<span class="badge badge-primary">${escapeHtml(h.name)} (${escapeHtml(h.email)}) <button type="button" data-remove="${c.id}" data-user="${h.id}" style="border:0;background:none;color:inherit;cursor:pointer">×</button></span>`).join(' ')||'<span class="muted">No Club Head assigned</span>'}</div><div class="form-grid" style="margin-top:14px"><div class="form-group"><label>Assign by email</label><input class="form-control" data-email="${c.id}" placeholder="student@..." /></div><div class="form-group" style="align-self:end"><button class="btn btn-primary btn-sm" data-assign="${c.id}">Assign Club Head</button></div></div></article>`).join('')||'<div class="empty-state"><p>No clubs.</p></div>';document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{try{await Api.approveClubRequest(b.dataset.approve);load()}catch(e){showAlert(alertBox,e.message)}});document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{const note=prompt('Reason (optional):')||'';try{await Api.rejectClubRequest(b.dataset.reject,note);load()}catch(e){showAlert(alertBox,e.message)}});document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=async()=>{const input=document.querySelector(`[data-email="${b.dataset.assign}"]`);try{await Api.assignClubHead(b.dataset.assign,{userEmail:input.value.trim()});showAlert(alertBox,'Club Head assigned.','success');load()}catch(e){showAlert(alertBox,e.message)}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{try{await Api.removeClubHead(b.dataset.remove,{userId:b.dataset.user});load()}catch(e){showAlert(alertBox,e.message)}})}catch(e){showAlert(alertBox,e.message)}}createForm.onsubmit=async e=>{e.preventDefault();try{await Api.createAdminClub({name:cName.value,shortName:cShort.value,category:cCategory.value,department:cDepartment.value,description:cDescription.value,logoUrl:cLogo.value,coverImage:cCover.value});showAlert(alertBox,'Club created.','success');e.target.reset();load()}catch(x){showAlert(alertBox,x.message)}};load();</script></body></html>
