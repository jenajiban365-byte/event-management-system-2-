<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clubs - EventHub Admin</title>
<link rel="stylesheet" href="../css/style.css?v=37">

<link rel="stylesheet" href="../css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="../css/mobile-polish.css?v=52">
<link rel="stylesheet" href="../css/eventhub-v61.css?v=61">
  <link rel="stylesheet" href="../css/mobile-v63.css?v=63.1">
</head>
<body>
<div id="navbar" class="navbar"></div>
<main class="container admin-page">
  <div class="page-header">
    <div>
      <span class="eyebrow">COLLEGE ADMIN</span>
      <h1>Club Management</h1>
      <p>Review club requests and keep the college club directory organized.</p>
    </div>
    <a class="btn btn-primary" href="create-club.html">＋ Create Club →</a>
  </div>
  <div id="alertBox"></div>

  <section class="card">
    <div class="section-heading-row" style="margin-bottom:16px">
      <div><span class="eyebrow">REQUESTS</span><h2 style="margin:6px 0">Pending Club Requests</h2></div>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Proposed Club</th><th>Requester</th><th>Category</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="requests"></tbody>
      </table>
    </div>
  </section>

  <section class="card" style="margin-top:24px">
    <div class="section-heading-row" style="margin-bottom:16px">
      <div><span class="eyebrow">DIRECTORY</span><h2 style="margin:6px 0">Your Clubs</h2></div>
      <a class="btn btn-outline btn-sm" href="assign-club-head.html">Assign heads</a>
    </div>
    <div id="clubs" class="grid grid-2 admin-club-directory"></div>
  </section>
</main>
<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
requireAdmin();
renderAdminNavbar('clubs');
const alertBox=document.getElementById('alertBox');
const requests=document.getElementById('requests');
const clubs=document.getElementById('clubs');
async function load(){
  try{
    const [cr,cl]=await Promise.all([Api.getClubRequests(),Api.getAdminClubs()]);
    requests.innerHTML=cr.requests.length?cr.requests.map(r=>`<tr><td><strong>${escapeHtml(r.proposedName)}</strong><br><span class="muted">${escapeHtml(r.description||'')}</span></td><td>${escapeHtml(r.requestedBy?.name||'')}<br>${escapeHtml(r.requestedBy?.email||'')}</td><td>${escapeHtml(r.category||'')}</td><td><span class="badge badge-warning">${escapeHtml(r.status)}</span></td><td>${r.status==='pending'?`<div class="action-row"><button class="btn btn-primary btn-sm" data-approve="${r.id}">Approve</button><button class="btn btn-danger btn-sm" data-reject="${r.id}">Reject</button></div>`:'—'}</td></tr>`).join(''):'<tr><td colspan="5">No club requests.</td></tr>';
    clubs.innerHTML=cl.clubs.map(c=>`<article class="card"><div class="event-card-topline"><span class="badge ${c.status==='active'?'badge-success':'badge-warning'}">${escapeHtml(c.status)}</span><span>${(c.clubHeads||[]).length} head(s)</span></div><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.category)} · ${escapeHtml(c.department||'General')}</p><p>${escapeHtml(c.description||'')}</p><div>${(c.clubHeads||[]).map(h=>`<span class="badge badge-primary" style="margin:3px 4px 3px 0">${escapeHtml(h.name)}</span>`).join('')||'<span class="muted">No Club Head assigned</span>'}</div></article>`).join('')||'<div class="empty-state"><p>No clubs yet.</p></div>';
    document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{try{await Api.approveClubRequest(b.dataset.approve);showAlert(alertBox,'Club request approved.','success');load();}catch(e){showAlert(alertBox,e.message)}});
    document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{const note=prompt('Reason (optional):')||'';try{await Api.rejectClubRequest(b.dataset.reject,note);showAlert(alertBox,'Club request rejected.','success');load();}catch(e){showAlert(alertBox,e.message)}});
  }catch(e){showAlert(alertBox,e.message)}
}
load();
</script>
</body>
</html>
