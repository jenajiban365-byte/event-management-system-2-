<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Approvals - EventHub</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="navbar" class="navbar"></div><main class="container"><div class="page-header"><div><span class="eyebrow">COLLEGE ADMIN</span><h1>Club approvals</h1><p>Approve campus clubs and grant organizer access.</p></div></div><div id="alertBox"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Club</th><th>Requested by</th><th>Category</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireAdmin();renderAdminNavbar('clubs');const body=document.getElementById('body'),alertBox=document.getElementById('alertBox');async function load(){try{const r=await apiRequest('/clubs/admin/all');body.innerHTML=r.clubs.length?r.clubs.map(c=>`<tr><td><strong>${escapeHtml(c.name)}</strong><br><span class="muted">${escapeHtml(c.description||'')}</span></td><td>${escapeHtml(c.createdBy?.name||'')}<br>${escapeHtml(c.createdBy?.email||'')}</td><td>${escapeHtml(c.category)}</td><td>${escapeHtml(c.status)}</td><td>${c.status==='pending'?`<button class="btn btn-primary btn-sm" data-id="${c.id}" data-status="approved">Approve</button> <button class="btn btn-danger btn-sm" data-id="${c.id}" data-status="blocked">Reject</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="5">No club requests.</td></tr>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{await apiRequest(`/clubs/admin/${b.dataset.id}/status`,{method:'PUT',body:{status:b.dataset.status}});load()}catch(e){showAlert(alertBox,e.message)}})}catch(e){showAlert(alertBox,e.message)}}load();</script></body></html>
