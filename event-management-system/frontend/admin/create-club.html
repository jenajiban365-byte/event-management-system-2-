<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Club - EventHub Admin</title><link rel="stylesheet" href="../css/style.css?v=37">
<link rel="stylesheet" href="../css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="../css/mobile-polish.css?v=52">
<link rel="stylesheet" href="../css/eventhub-v61.css?v=61">
  <link rel="stylesheet" href="../css/mobile-v63.css?v=63.1">
</head><body><div id="navbar" class="navbar"></div><main class="container admin-page"><div class="page-header"><div><span class="eyebrow">COLLEGE ADMIN · CLUBS</span><h1>Create a club</h1><p>Set up a new campus community. Club Head assignment is handled separately.</p></div><a class="btn btn-outline" href="clubs.html">← Back to Clubs</a></div><div id="alertBox"></div><section class="card admin-action-card"><div class="section-heading-row"><div><span class="eyebrow">01 / CREATE</span><h2>New club</h2></div></div><form id="createForm" class="form-grid"><div class="form-group"><label for="cName">Club name</label><input id="cName" class="form-control" required placeholder="e.g. Coding Ninjas"></div><div class="form-group"><label for="cShort">Short name</label><input id="cShort" class="form-control" placeholder="e.g. CN"></div><div class="form-group"><label for="cCategory">Category</label><input id="cCategory" class="form-control" required placeholder="Coding & Technology"></div><div class="form-group"><label for="cDepartment">Department</label><input id="cDepartment" class="form-control" placeholder="Computer Science & IT"></div><div class="form-group full"><label for="cDescription">Description</label><textarea id="cDescription" class="form-control" rows="5" placeholder="What makes this club worth joining?"></textarea></div><div class="form-group"><label for="cLogo">Logo URL</label><input id="cLogo" class="form-control" placeholder="https://..."></div><div class="form-group"><label for="cCover">Cover image URL</label><input id="cCover" class="form-control" placeholder="https://..."></div><div class="form-group full"><button class="btn btn-primary" type="submit">Create Club →</button></div></form></section></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireAdmin();renderAdminNavbar('clubs');const alertBox=document.getElementById('alertBox');document.getElementById('createForm').addEventListener('submit',async e=>{e.preventDefault();try{await Api.createAdminClub({name:cName.value,shortName:cShort.value,category:cCategory.value,department:cDepartment.value,description:cDescription.value,logoUrl:cLogo.value,coverImage:cCover.value});showAlert(alertBox,'Club created successfully.','success');e.target.reset();}catch(err){showAlert(alertBox,err.message)}});</script></body></html>
