<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Users - EventHub Admin</title>
<link rel="stylesheet" href="../css/style.css?v=37" />

<link rel="stylesheet" href="../css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="../css/mobile-polish.css?v=52">
<link rel="stylesheet" href="../css/eventhub-v61.css?v=61">
  <link rel="stylesheet" href="../css/mobile-v63.css?v=63.1">
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <div class="page-header">
    <div>
      <h1>Manage Users</h1>
      <p>View users, manage account status, and assign trusted staff roles.</p>
    </div>
  </div>

  <div id="alertBox"></div>

  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script>
  requireAdmin();
  renderAdminNavbar('users');

  const alertBox = document.getElementById('alertBox');
  const usersBody = document.getElementById('usersBody');
  const currentUser = Session.getUser();

  function pickClub(title) {
    return new Promise(async (resolve, reject) => {
      let clubs = [];
      try { clubs = (await Api.getAdminClubs()).clubs || []; } catch (e) { clubs = []; }
      clubs = clubs.filter((c) => ['approved', 'active'].includes(c.status));
      if (!clubs.length) {
        showAlert(alertBox, 'Create an approved club first, then assign an organizer to it.');
        reject(new Error('no-clubs'));
        return;
      }
      const scrim = document.createElement('div');
      scrim.style.cssText = 'position:fixed;inset:0;background:rgba(15,20,28,.5);display:grid;place-items:center;z-index:999;padding:20px';
      scrim.innerHTML = `<div class="card" style="width:min(420px,100%);padding:24px">
        <h3 style="margin:0 0 6px">${escapeHtml(title)}</h3>
        <p class="muted" style="margin:0 0 14px">Pick a primary club for the organizer profile. Organizers can manage the full campus event registry; this club is used as their primary affiliation.</p>
        <select id="pickClubSelect" class="form-control" style="margin-bottom:16px">
          ${clubs.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}
        </select>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn btn-outline" type="button" id="pickClubCancel">Cancel</button>
          <button class="btn btn-primary" type="button" id="pickClubOk">Assign</button>
        </div>
      </div>`;
      document.body.appendChild(scrim);
      const close = () => scrim.remove();
      scrim.querySelector('#pickClubCancel').addEventListener('click', () => { close(); reject(new Error('cancelled')); });
      scrim.addEventListener('click', (e) => { if (e.target === scrim) { close(); reject(new Error('cancelled')); } });
      scrim.querySelector('#pickClubOk').addEventListener('click', () => {
        const val = scrim.querySelector('#pickClubSelect').value;
        close();
        resolve(val);
      });
    });
  }

  function statusBadge(status) {
    return status === 'blocked'
      ? '<span class="badge badge-danger">Blocked</span>'
      : '<span class="badge badge-success">Active</span>';
  }
  function roleBadge(role) {
    const labels = { admin: 'Admin', organizer: 'Organizer', club_head: 'Club Head', user: 'Student' };
    const classes = { admin: 'badge-primary', organizer: 'badge-primary', club_head: 'badge-primary', user: 'badge-muted' };
    return `<span class="badge ${classes[role] || 'badge-muted'}">${labels[role] || role}</span>`;
  }

  async function load() {
    try {
      clearAlert(alertBox);
      const { users } = await Api.getAllUsers();
      usersBody.innerHTML = users.length
        ? users.map((u) => `
            <tr>
              <td>${escapeHtml(u.name)}</td>
              <td>${escapeHtml(u.email)}</td>
              <td>${roleBadge(u.role)}</td>
              <td>${statusBadge(u.status)}</td>
              <td>${formatDate(u.createdAt ? u.createdAt.split('T')[0] : '')}</td>
              <td>
                <div class="action-row">
                  ${u.id === currentUser.id ? '<span style="color:var(--text-muted); font-size:0.82rem;">(you)</span>' : `
                    ${u.role !== 'admin' ? `<select class="form-control form-control-sm" data-role-select="${u.id}" aria-label="Change role for ${escapeHtml(u.name)}">
                      <option value="user" ${u.role === 'user' ? 'selected' : ''}>Student</option>
                      <option value="organizer" ${u.role === 'organizer' ? 'selected' : ''}>Organizer</option>
                    </select>` : ''}
                    <button class="btn btn-outline btn-sm" data-toggle-status="${u.id}" data-current="${u.status}">
                      ${u.status === 'blocked' ? 'Unblock' : 'Block'}
                    </button>
                    <button class="btn btn-danger btn-sm" data-delete="${u.id}">Delete</button>
                  `}
                </div>
              </td>
            </tr>
          `).join('')
        : `<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No users found.</td></tr>`;


      document.querySelectorAll('[data-role-select]').forEach((select) => {
        select.addEventListener('change', async () => {
          const id = select.getAttribute('data-role-select');
          const role = select.value;

          if (role === 'organizer') {
            // An Organizer only sees events/registrations for the club(s)
            // they're linked to, so we need to know which club before we
            // can promote them — otherwise they'd be an organizer of nothing.
            let clubId;
            try {
              clubId = await pickClub('Make Organizer of which club?');
            } catch (e) { load(); return; } // cancelled
            try {
              await Api.updateAdminUserRole(id, { role, clubId });
              load();
            } catch (err) {
              showAlert(alertBox, err.message);
              load();
            }
            return;
          }

          if (!confirm('Change this account back to Student?')) {
            load();
            return;
          }
          try {
            await Api.updateAdminUserRole(id, { role });
            load();
          } catch (err) {
            showAlert(alertBox, err.message);
            load();
          }
        });
      });
      document.querySelectorAll('[data-toggle-status]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const newStatus = btn.getAttribute('data-current') === 'blocked' ? 'active' : 'blocked';
          try {
            await Api.updateUser(btn.getAttribute('data-toggle-status'), { status: newStatus });
            load();
          } catch (err) {
            showAlert(alertBox, err.message);
          }
        });
      });
      document.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this user account permanently?')) return;
          try {
            await Api.deleteUser(btn.getAttribute('data-delete'));
            load();
          } catch (err) {
            showAlert(alertBox, err.message);
          }
        });
      });
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  }

  load();
</script>
</body>
</html>
