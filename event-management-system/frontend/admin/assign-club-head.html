<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assign Club Heads - EventHub Admin</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="navbar" class="navbar"></div><main class="container admin-page"><div class="page-header"><div><span class="eyebrow">COLLEGE ADMIN · CLUBS</span><h1>Assign Club Heads</h1><p>Give approved student accounts ownership of their assigned club.</p></div><a class="btn btn-outline" href="clubs.html">← Back to Clubs</a></div><div id="alertBox"></div><section class="card admin-action-card"><div class="section-heading-row"><div><span class="eyebrow">02 / OWNERSHIP</span><h2>Club Head assignments</h2></div></div><p class="muted">Club Head accounts are assigned by College Admin. Students cannot promote themselves into this role.</p><div id="clubs" class="grid grid-2 assign-clubs-grid"></div></section></main><script src="../js/api.js"></script><script src="../js/nav.js"></script><script>requireAdmin();renderAdminNavbar('clubs');const alertBox=document.getElementById('alertBox'),clubs=document.getElementById('clubs');async function loadClubs(){try{const {clubs:list=[]}=await Api.getAdminClubs();clubs.innerHTML=list.map(c=>`<article class="club-head-card"><div class="event-card-topline"><span class="badge ${c.status==='active'?'badge-success':'badge-warning'}">${escapeHtml(c.status)}</span><span>${(c.clubHeads||[]).length} head(s)</span></div><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.category)} · ${escapeHtml(c.department||'General')}</p><div class="club-head-list">${(c.clubHeads||[]).map(h=>`<span class="badge badge-primary">${escapeHtml(h.name)} · ${escapeHtml(h.email)} <button type="button" data-remove="${c.id}" data-user="${h.id}" aria-label="Remove ${escapeHtml(h.name)}">×</button></span>`).join('')||'<span class="muted">No Club Head assigned yet.</span>'}</div><div class="form-grid assign-head-row"><div class="form-group"><label for="head-${c.id}">Student email</label><input id="head-${c.id}" class="form-control" placeholder="student@college.edu" data-email="${c.id}"></div><div class="form-group assign-head-button"><button type="button" class="btn btn-primary" data-assign="${c.id}">Assign Head →</button></div></div></article>`).join('')||'<div class="empty-state"><p>No clubs exist yet. Create a club first.</p><a class="btn btn-primary" href="create-club.html">Create club →</a></div>';document.querySelectorAll('[data-assign]').forEach(btn=>btn.onclick=async()=>{const input=document.querySelector(`[data-email="${btn.dataset.assign}"]`);if(!input.value.trim())return showAlert(alertBox,'Enter the student email first.');try{await Api.assignClubHead(btn.dataset.assign,{userEmail:input.value.trim()});showAlert(alertBox,'Club Head assigned successfully.','success');await loadClubs()}catch(e){showAlert(alertBox,e.message)}});document.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=async()=>{if(!confirm('Remove this Club Head assignment?'))return;try{await Api.removeClubHead(btn.dataset.remove,{userId:btn.dataset.user});showAlert(alertBox,'Club Head assignment removed.','success');await loadClubs()}catch(e){showAlert(alertBox,e.message)}})}catch(e){showAlert(alertBox,e.message)}}loadClubs();</script></body></html>
