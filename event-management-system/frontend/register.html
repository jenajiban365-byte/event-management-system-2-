<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account - EventHub</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-icon">🎫</div>
    <h1>EventHub</h1>
    <p class="tagline">Create an account to start booking events.</p>

    <div class="auth-box">
      <div class="auth-tabs">
        <a href="login.html">Sign in</a>
        <a href="register.html" class="active">Create account</a>
      </div>

      <div id="alertBox"></div>
      <div id="verificationBox" style="display:none;" class="card" aria-live="polite"></div>
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Jane Doe" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6" />
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create Account</button>
      </form>

      <div class="auth-divider">or</div>
      <div id="googleSignInBtn" style="display:flex; justify-content:center;"></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNavbar('register');
  redirectIfLoggedIn();

  const form = document.getElementById('registerForm');
  const alertBox = document.getElementById('alertBox');
  const submitBtn = document.getElementById('submitBtn');
  const verificationBox = document.getElementById('verificationBox');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert(alertBox);

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
      showAlert(alertBox, 'Passwords do not match.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';

    try {
      const data = await Api.register({ name, email, password });
      if (data.requiresVerification) {
        form.style.display = 'none';
        document.querySelector('.auth-divider').style.display = 'none';
        document.getElementById('googleSignInBtn').style.display = 'none';
        verificationBox.style.display = 'block';
        verificationBox.innerHTML = `<strong>Check your inbox.</strong><p style="margin:8px 0 14px;color:var(--text-muted)">${escapeHtml(data.message)}</p><button type="button" class="btn btn-outline btn-block" id="resendVerificationBtn">Resend verification email</button>`;
        document.getElementById('resendVerificationBtn').addEventListener('click', async () => {
          const btn = document.getElementById('resendVerificationBtn'); btn.disabled = true;
          try { const result = await Api.resendVerification(email); showAlert(alertBox, result.message, 'success'); }
          catch (err) { showAlert(alertBox, err.message); }
          finally { btn.disabled = false; }
        });
        showAlert(alertBox, data.message, 'success');
        submitBtn.disabled = false; submitBtn.textContent = 'Create Account';
        return;
      }
      Session.setSession(data.token, data.user);
      window.location.href = 'events.html';
    } catch (err) {
      showAlert(alertBox, err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
    }
  });

  initGoogleSignIn(
    'googleSignInBtn',
    (data) => {
      Session.setSession(data.token, data.user);
      window.location.href = data.user.role === 'admin' ? 'admin/dashboard.html' : 'events.html';
    },
    (err) => showAlert(alertBox, err.message)
  );
</script>
</body>
</html>
