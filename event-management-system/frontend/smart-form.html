<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Campus Smart Form — EventHub</title><link rel="stylesheet" href="css/style.css?v=37"><link rel="stylesheet" href="css/eventhub-premium.css?v=48"><link rel="stylesheet" href="css/mobile-polish.css?v=52">

<style>
body.smart-form-body{background:#f4f7f8}.smart-form-shell{max-width:820px;margin:0 auto;padding:28px 16px 70px}.sf-brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.sf-brand-mark{display:flex;align-items:center;gap:9px;font-weight:900}.sf-dot{width:12px;height:12px;border-radius:50%;background:#6554e8;box-shadow:0 0 0 6px #eeeaff}.sf-powered{font-size:.68rem;color:#73838c;font-weight:800}.sf-hero{position:relative;overflow:hidden;border-radius:28px;border:1px solid #d8e2e5;background:linear-gradient(135deg,#fffdf8,#f1efff 58%,#e8f8f2);box-shadow:0 8px 0 rgba(24,37,47,.08)}.sf-cover{height:180px;background:linear-gradient(135deg,#6554e8,#17a67f);background-size:cover;background-position:center}.sf-hero-content{padding:28px}.sf-kicker{font-size:.68rem;letter-spacing:.14em;font-weight:900;color:#6554e8}.sf-hero h1{font-size:clamp(2.2rem,6vw,4rem);line-height:.96;margin:8px 0 11px}.sf-hero p{max-width:700px;color:#64757e;line-height:1.65;margin:0}.sf-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:17px}.sf-pill{padding:7px 10px;border:1px solid #d7e2e4;border-radius:999px;background:rgba(255,255,255,.82);font-size:.72rem;font-weight:800;color:#50626c}.sf-profile{margin-top:14px;padding:15px 17px;border:1px solid #cfe2dd;border-radius:18px;background:#eff9f6}.sf-profile strong{color:#24594f}.sf-profile-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sf-chip{padding:5px 8px;border-radius:999px;background:#fff;border:1px solid #d5e5e1;font-size:.7rem;color:#5e7079}.sf-card{margin-top:15px;padding:20px;border:1px solid #d8e2e5;border-radius:24px;background:#fff;box-shadow:0 8px 0 rgba(24,37,47,.05)}.sf-progress{display:flex;align-items:center;gap:10px;margin-bottom:16px}.sf-progress-track{height:7px;flex:1;background:#e8edef;border-radius:999px;overflow:hidden}.sf-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#6554e8,#17a67f);transition:width .2s}.sf-progress-text{font-size:.68rem;font-weight:900;color:#687982;white-space:nowrap}.sf-section{padding:13px 4px 8px;margin:8px 0 3px}.sf-section h2{font-size:1.45rem;margin:0 0 5px}.sf-section p{color:#71818a;font-size:.78rem;line-height:1.5;margin:0}.sf-question{padding:18px 17px;margin:12px 0;border:1px solid #dce5e7;border-radius:19px;background:#fff}.sf-question.hidden{display:none}.sf-q-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.sf-q-title label{font-size:1rem;line-height:1.4;font-weight:800}.sf-required{padding:4px 7px;border-radius:999px;background:#fff0f0;color:#b45151;font-size:.61rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.sf-help{margin:5px 0 11px;color:#7a8992;font-size:.75rem;line-height:1.5}.sf-question input,.sf-question textarea,.sf-question select{width:100%;box-sizing:border-box}.sf-question textarea{min-height:120px;resize:vertical}.sf-choice-list{display:grid;gap:8px}.sf-choice{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border:1px solid #dce5e7;border-radius:13px;background:#fafcfc;font-size:.82rem;color:#4f6069}.sf-choice input{width:auto;margin-top:3px}.sf-scale{display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap}.sf-scale label{display:grid;place-items:center;gap:5px;font-size:.7rem;color:#667781}.sf-scale input{width:22px}.sf-file{padding:14px;border:1px dashed #cbd9dc;border-radius:14px;background:#fafcfc}.sf-submit{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px;margin-top:18px;border-top:1px solid #e4eaec}.sf-submit-note{font-size:.7rem;color:#74838c}.sf-success{text-align:center;padding:34px 20px}.sf-ticket{margin:20px auto;max-width:540px;padding:22px;border-radius:22px;border:2px solid #17232d;background:linear-gradient(135deg,#fff6c9,#eef8f4);box-shadow:7px 7px 0 #17232d;text-align:left}.sf-ticket-code{font-size:1.8rem;font-weight:900;letter-spacing:.12em;margin-top:12px}.sf-error{padding:14px;border-radius:14px;background:#fff0f0;border:1px solid #f0caca;color:#a64747}.sf-closed{text-align:center;padding:50px 20px}.sf-closed h1{margin:0 0 8px}.sf-closed p{color:#71818a}.sf-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
@media(max-width:640px){.smart-form-shell{padding:12px 10px 50px}.sf-cover{height:125px}.sf-hero-content{padding:20px 17px}.sf-hero{border-radius:21px}.sf-hero h1{font-size:clamp(2rem,10vw,3rem)}.sf-card{padding:13px;border-radius:20px}.sf-question{padding:15px;border-radius:17px}.sf-submit{display:grid}.sf-submit .btn{width:100%}.sf-progress{align-items:flex-start;flex-direction:column}.sf-progress-track{width:100%}}

<body class="smart-form-body"><main class="smart-form-shell"><div class="sf-brand"><div class="sf-brand-mark"><span class="sf-dot"></span> EventHub · Campus Smart Form</div><span class="sf-powered">CONNECTED REGISTRATION</span></div><div id="app"></div></main>
<script src="js/api.js"></script><script src="js/nav.js"></script><script>
const eventId=new URLSearchParams(location.search).get('event');const app=document.getElementById('app');let data=null,user=null;const esc=window.escapeHtml||((v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function answerValue(i){const q=data.form.questions[i];if(q.type==='checkbox_group')return [...document.querySelectorAll(`[data-q="${i}"]:checked`)].map(x=>x.value).join(', ');const el=document.querySelector(`[data-q="${i}"]`);if(!el)return '';if(el.type==='checkbox')return el.checked?'Yes':'';if(el.type==='file')return el.files?.[0]?.name||'';return String(el.value||'').trim()}
function visible(q,i){const dep=q.showWhen?.questionIndex;if(dep===null||dep===undefined||dep===''||Number(dep)<0||Number(dep)>=i)return true;return answerValue(Number(dep))===String(q.showWhen.equals||'')}
function input(q,i){const req=q.required!==false?'required':'';if(q.type==='paragraph'||q.type==='textarea')return `<textarea class="form-control" data-q="${i}" ${req} maxlength="${q.maxLength||5000}" placeholder="Type your answer…"></textarea>`;if(q.type==='email')return `<input class="form-control" type="email" data-q="${i}" ${req} placeholder="you@example.com">`;if(q.type==='number')return `<input class="form-control" type="number" data-q="${i}" ${req}>`;if(q.type==='date')return `<input class="form-control" type="date" data-q="${i}" ${req}>`;if(q.type==='time')return `<input class="form-control" type="time" data-q="${i}" ${req}>`;if(q.type==='url')return `<input class="form-control" type="url" data-q="${i}" ${req} placeholder="https://…">`;if(q.type==='file')return `<div class="sf-file"><input type="file" data-q="${i}" ${req} accept="${esc(q.fileAccept||'image/*,.pdf,.doc,.docx,.ppt,.pptx,.txt,.zip')}"><div class="sf-help">Up to ${q.maxFileSizeMB||10} MB.</div></div>`;if(['multiple_choice','dropdown','select'].includes(q.type)){if(q.type==='dropdown'||q.type==='select')return `<select class="form-control" data-q="${i}" ${req}><option value="">Choose an option</option>${(q.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;return `<div class="sf-choice-list">${(q.options||[]).map(o=>`<label class="sf-choice"><input type="radio" name="q${i}" data-q="${i}" value="${esc(o)}" ${req}><span>${esc(o)}</span></label>`).join('')}</div>`}if(q.type==='checkbox_group'||q.type==='checkbox')return `<div class="sf-choice-list">${(q.options?.length?q.options:['Yes']).map(o=>`<label class="sf-choice"><input type="checkbox" data-q="${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`;if(q.type==='linear_scale'||q.type==='rating'){const min=Number(q.scaleMin??1),max=Number(q.scaleMax??5);return `<div class="sf-scale">${Array.from({length:Math.max(1,max-min+1)},(_,k)=>min+k).map(n=>`<label><input type="radio" name="q${i}" data-q="${i}" value="${n}" ${req}><span>${n}</span></label>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:.68rem;color:#71818a"><span>${esc(q.scaleMinLabel||'')}</span><span>${esc(q.scaleMaxLabel||'')}</span></div>`}return `<input class="form-control" data-q="${i}" ${req} placeholder="Your answer">`}
function render(){const e=data.event,f=data.form,theme=f.theme||{};document.documentElement.style.setProperty('--sf-accent',theme.accent||'#6554e8');const questions=f.questions||[];let order=questions.map((q,i)=>({q,i}));if(f.settings?.shuffleQuestions&&!questions.some(q=>q.showWhen?.questionIndex!=null))order=shuffle(order);const body=order.map(({q,i})=>q.type==='section'?`<div class="sf-section" data-section="${i}"><h2>${esc(q.question)}</h2>${q.description?`<p>${esc(q.description)}</p>`:''}</div>`:`<div class="sf-question" data-card="${i}" ${!visible(q,i)?'style="display:none"':''}><div class="sf-q-title"><label>${esc(q.question)}</label>${q.required!==false?'<span class="sf-required">Required</span>':''}</div>${q.description?`<div class="sf-help">${esc(q.description)}</div>`:''}${q.imageUrl?`<img src="${esc(q.imageUrl)}" alt="" style="display:block;width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin:8px 0 12px;border:1px solid #dfe7e8" loading="lazy">`:''}${input(q,i)}${q.type==='file'?`<div class="sf-help">Your file is attached to this event registration, not stored in a public feed.</div>`:''}</div>`).join('');app.innerHTML=`<section class="sf-hero"><div class="sf-cover" style="${theme.coverImage?`background-image:url('${String(theme.coverImage).replace(/'/g,"%27")}')`:''}"></div><div class="sf-hero-content"><span class="sf-kicker">${esc(f.title||'EVENT REGISTRATION')}</span><h1>${esc(e.title)}</h1><p>${esc(f.description||e.description||'Complete this campus registration form.')}</p><div class="sf-meta"><span class="sf-pill">📅 ${esc(e.date)} · ${esc(e.time||'')}</span><span class="sf-pill">📍 ${esc(e.location||'')}</span><span class="sf-pill">👥 ${e.spotsLeft} spots left</span>${e.registrationDeadline?`<span class="sf-pill">⏳ ${esc(e.registrationDeadline)}</span>`:''}</div><div class="sf-profile"><strong>✓ Your EventHub profile is attached</strong><div class="sf-profile-row"><span class="sf-chip">👤 ${esc(user?.name||'Student')}</span><span class="sf-chip">✉ ${esc(user?.email||'')}</span>${user?.department?`<span class="sf-chip">🎓 ${esc(user.department)}</span>`:''}${user?.year?`<span class="sf-chip">Year ${esc(user.year)}</span>`:''}</div></div></div></section><section class="sf-card"><div class="sf-progress"><div class="sf-progress-track"><div id="progressBar" class="sf-progress-bar"></div></div><span id="progressText" class="sf-progress-text">0%</span></div><div id="questions">${body}</div><div id="msg"></div><div class="sf-submit"><span class="sf-submit-note">Your response goes directly to the EventHub organizer roster.</span><button id="submit" class="btn btn-primary">Submit registration →</button></div></section>`;bind();updateProgress()}
function bind(){document.querySelectorAll('[data-q]').forEach(el=>{el.addEventListener('input',()=>{refreshLogic();updateProgress()});el.addEventListener('change',()=>{refreshLogic();updateProgress()})});document.getElementById('submit').onclick=submitForm}
function refreshLogic(){(data.form.questions||[]).forEach((q,i)=>{if(q.type==='section')return;const card=document.querySelector(`[data-card="${i}"]`);if(card)card.style.display=visible(q,i)?'':'none'})}
function updateProgress(){const qs=(data.form.questions||[]).filter(q=>q.type!=='section').filter((q,i)=>visible(q,data.form.questions.indexOf(q)));const answered=qs.filter(q=>answerValue(data.form.questions.indexOf(q)));const pct=qs.length?Math.round(answered.length/qs.length*100):100;const bar=document.getElementById('progressBar');if(bar)bar.style.width=pct+'%';const text=document.getElementById('progressText');if(text)text.textContent=pct+'% complete'}
async function submitForm(){const btn=document.getElementById('submit'),msg=document.getElementById('msg');btn.disabled=true;btn.textContent='Checking…';const qs=(data.form.questions||[]).filter(q=>q.type!=='section');const answers=[];const uploads=[];for(let i=0;i<qs.length;i++){const originalIndex=data.form.questions.indexOf(qs[i]);if(!visible(qs[i],originalIndex))continue;const el=document.querySelector(`[data-q="${originalIndex}"]`);let answer=answerValue(originalIndex);if(qs[i].type==='file'){const file=el?.files?.[0];if(file){const max=(qs[i].maxFileSizeMB||10)*1024*1024;if(file.size>max){msg.innerHTML=`<div class="sf-error">${esc(file.name)} is larger than ${qs[i].maxFileSizeMB||10} MB.</div>`;btn.disabled=false;btn.textContent='Submit registration →';return}uploads.push({file,originalIndex});answer=file.name}}if(qs[i].required!==false&&!answer){msg.innerHTML=`<div class="sf-error">Please answer: <b>${esc(qs[i].question)}</b></div>`;btn.disabled=false;btn.textContent='Submit registration →';return}answers.push({question:qs[i].question,answer})}try{for(const item of uploads){btn.textContent='Uploading attachment…';const up=await Api.uploadRegistrationAttachment(eventId,item.file);const question=data.form.questions[item.originalIndex];const idx=answers.findIndex(x=>x.question===question?.question);if(idx>=0)answers[idx].answer=JSON.stringify({name:item.file.name,url:up.attachment.url,size:item.file.size,contentType:item.file.type})}btn.textContent='Saving response…';const result=await Api.createBooking(eventId,answers);const booking=result.booking||{};const code=booking.checkInCode||'EVENTHUB';app.innerHTML=`<section class="sf-card sf-success"><div style="font-size:3rem">✓</div><span class="sf-kicker">RESPONSE RECORDED</span><h1>${esc(data.form.settings?.confirmationTitle||'You’re registered!')}</h1><p>${esc(data.form.settings?.confirmationMessage||'Your response has been recorded on EventHub.')}</p>${data.form.settings?.showDigitalTicket!==false?`<div class="sf-ticket"><span class="sf-kicker">EVENTHUB DIGITAL TICKET</span><h2>${esc(data.event.title)}</h2><p>📅 ${esc(data.event.date)} · ${esc(data.event.time||'')}<br>📍 ${esc(data.event.location||'')}<br>👤 ${esc(user?.name||'Student')}</p><div class="sf-ticket-code">${esc(code)}</div></div>`:''}<div class="sf-actions"><a class="btn btn-primary" href="my-bookings.html">View my booking</a><a class="btn btn-outline" href="events.html">Discover more</a></div></section>`}catch(e){if(e.status===409)msg.innerHTML='<div class="sf-error"><b>You are already registered.</b> Your EventHub pass is in My Bookings.</div>';else msg.innerHTML=`<div class="sf-error">${esc(e.message)}</div>`;btn.disabled=false;btn.textContent='Submit registration →'}}
(async function(){try{if(!eventId)throw new Error('Registration form not found.');if(!Session.isLoggedIn()){location.href='login.html?redirect='+encodeURIComponent(location.href);return}const me=await Api.me();user=me.user;data=await Api.getPublicRegistrationForm(eventId);if(!data.form?.enabled)throw new Error('This registration form is not enabled.');render()}catch(e){app.innerHTML=`<section class="sf-card sf-closed"><h1>Registration unavailable</h1><p>${esc(e.message)}</p><div class="sf-actions"><a class="btn btn-outline" href="events.html">← Discover events</a></div></section>`}})();
</script></body></html>
