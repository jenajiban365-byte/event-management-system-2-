<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Questions - EventHub</title><link rel="stylesheet" href="css/style.css?v=37">
<link rel="stylesheet" href="css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="css/mobile-polish.css?v=52">
<link rel="stylesheet" href="css/eventhub-v61.css?v=61">
  <link rel="stylesheet" href="css/mobile-v63.css?v=63.1">
</head><body><div id="navbar" class="navbar"></div><main class="container" style="max-width:850px"><div class="page-header"><div><span class="eyebrow">SUPPORT</span><h1>My questions</h1><p>Replies from the college team stay here, alongside your notifications.</p></div><a class="btn btn-primary" href="contact.html">Ask a question</a></div><div id="alertBox"></div><div id="tickets"></div></main><script src="js/api.js"></script><script src="js/nav.js"></script><script>requireAuth();renderNavbar('support');const box=document.getElementById('tickets'),alertBox=document.getElementById('alertBox');function esc(x){return escapeHtml(x||'')}async function load(){try{const{tickets}=await Api.getMySupportTickets();box.innerHTML=tickets.length?tickets.map(t=>`<article class="card" style="margin-bottom:16px"><div class="event-card-topline"><strong>${esc(t.subject)}</strong><span class="badge ${t.status==='resolved'?'badge-success':'badge-warning'}">${esc(t.status)}</span></div><div style="margin-top:14px">${t.messages.map(m=>`<div style="padding:12px 0;border-top:1px solid var(--border)"><strong>${esc(m.senderName)}</strong><span class="muted"> · ${formatDateTime(m.createdAt)}</span><p style="margin:6px 0 0;white-space:pre-wrap">${esc(m.body)}</p></div>`).join('')}</div></article>`).join(''):`<div class="empty-state"><h3>No questions yet</h3><p>Use Contact to ask the EventHub team anything.</p></div>`}catch(e){showAlert(alertBox,e.message)}}load();</script></body></html>
