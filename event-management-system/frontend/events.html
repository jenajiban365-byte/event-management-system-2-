<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Discover Events - EventHub</title>
<meta name="description" content="Discover and book upcoming events on EventHub." />
<meta property="og:title" content="Discover Events - EventHub" />
<meta property="og:description" content="Find the event worth leaving the house for." />
<meta property="og:type" content="website" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#fffaf0" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<main class="container">
  <div class="events-intro">
    <div>
      <div class="eyebrow">DISCOVER WHAT'S NEXT</div>
      <h1 id="eventsTitle">Discover events you'll love</h1>
      <p id="eventsSubtitle">Search for an event, club, venue, category or date to get exactly what you want.</p>
    </div>
  </div>

  <section class="search-filters-section" aria-labelledby="searchFiltersTitle">
    <div class="search-filters-container">
      <div class="search-row">
        <div class="search-wrapper">
          <label for="eventSearch" class="visually-hidden">Search events</label>
          <input type="search" id="eventSearch" class="form-control search-input" placeholder="Search events, clubs, venues..." aria-label="Search events, clubs, venues" />
          <span class="search-icon" aria-hidden="true">🔍</span>
        </div>
        <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="eventFilters">⚙ Filters <span class="filter-count" id="filterCount" hidden>0</span></button>
      </div>
      <div class="filters-wrapper" id="eventFilters">
        <div class="filter-group">
          <label for="dateFilter">Date</label>
          <select id="dateFilter" class="form-control filter-select" aria-label="Filter by date">
            <option value="">Any date</option>
            <option value="today">Today</option>
            <option value="this-week">This week</option>
            <option value="this-month">This month</option>
            <option value="upcoming">Upcoming</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="priceFilter">Price</label>
          <select id="priceFilter" class="form-control filter-select" aria-label="Filter by price">
            <option value="">Any price</option>
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="availabilityFilter">Availability</label>
          <select id="availabilityFilter" class="form-control filter-select" aria-label="Filter by availability">
            <option value="">Any availability</option>
            <option value="available">Available</option>
            <option value="waitlist">Waitlist only</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="sortFilter">Sort</label>
          <select id="sortFilter" class="form-control filter-select" aria-label="Sort events">
            <option value="date">Date (soonest)</option>
            <option value="popular">Most popular</option>
            <option value="date-desc">Date (latest)</option>
          </select>
        </div>
      </div>
      <div class="active-filters-row" id="activeFiltersRow" hidden>
        <div class="active-filter-chips" id="activeFilterChips"></div>
        <button type="button" class="btn btn-sm btn-outline" id="clearFiltersBtn">Clear all</button>
      </div>
    </div>
  </section>

  <section class="category-chips-section" aria-labelledby="categoryChipsTitle">
    <div class="category-chips-container" id="categoryChips" role="tablist" aria-label="Event categories"></div>
  </section>

  <section id="resultsSection" class="results-section" aria-labelledby="resultsTitle">
    <div class="results-toolbar">
      <div>
        <div class="eyebrow">YOUR RESULTS</div>
        <h2 id="resultsTitle">Upcoming events</h2>
      </div>
      <span id="resultsSummary" aria-live="polite"></span>
    </div>
    <div id="eventsGrid" class="grid grid-3" aria-live="polite"></div>
  </section>


  <section class="nearby-shell" aria-labelledby="nearbyTitle">
    <div class="nearby-copy">
      <div class="eyebrow">OPTIONAL</div>
      <h2 id="nearbyTitle">Find events near you</h2>
      <p id="locationStatus">Use your current location only when you want nearby sorting.</p>
    </div>
    <div class="nearby-actions">
      <button class="btn btn-primary" id="nearMeBtn" type="button">📍 Near Me</button>
      <button class="btn btn-outline hidden" id="clearLocationBtn" type="button">Clear location</button>
    </div>
  </section>

  <div id="alertBox"></div>
</main>

<footer class="site-footer">EventHub &mdash; Event Management System</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNavbar('events');

  if (!Session.isLoggedIn()) {
    document.querySelector('main.container').innerHTML = `
      <section class="guest-gate">
        <span class="eyebrow">STUDENT ACCESS</span>
        <h1>Campus is waiting for you.</h1>
        <p>Sign in to discover events, use filters, save experiences and book your seat.</p>
        <div class="guest-gate-actions">
          <a class="btn btn-primary" href="login.html">Sign in →</a>
          <a class="btn btn-outline" href="register.html">Create free account</a>
        </div>
      </section>`;
  } else {

  const eventsGrid = document.getElementById('eventsGrid');
  const resultsSection = document.getElementById('resultsSection');
  const eventsTitle = document.getElementById('eventsTitle');
  const eventsSubtitle = document.getElementById('eventsSubtitle');
  const alertBox = document.getElementById('alertBox');
  const eventSearch = document.getElementById('eventSearch');
  const dateFilter = document.getElementById('dateFilter');
  const priceFilter = document.getElementById('priceFilter');
  const availabilityFilter = document.getElementById('availabilityFilter');
  const sortFilter = document.getElementById('sortFilter');
  const categoryChips = document.getElementById('categoryChips');
  const resultsSummary = document.getElementById('resultsSummary');
  const nearMeBtn = document.getElementById('nearMeBtn');
  const clearLocationBtn = document.getElementById('clearLocationBtn');
  const locationStatus = document.getElementById('locationStatus');
  const filterToggle = document.getElementById('filterToggle');
  const eventFilters = document.getElementById('eventFilters');
  const filterCount = document.getElementById('filterCount');
  const activeFiltersRow = document.getElementById('activeFiltersRow');
  const activeFilterChips = document.getElementById('activeFilterChips');
  const clearFiltersBtn = document.getElementById('clearFiltersBtn');


  let selectedCategory = '';
  let userLocation = null;
  let nearMeActive = false;
  let nearMeRequestId = 0;
  let searchQuery = '';
  let allEvents = [];
  let allCategories = [];

  // Discover opens with every upcoming event; URL params let other pages deep-link
  // straight into a search or category (e.g. events.html?category=Tech).
  const initialParams = new URLSearchParams(window.location.search);
  dateFilter.value = '';
  priceFilter.value = '';
  availabilityFilter.value = '';
  sortFilter.value = 'date';
  searchQuery = (initialParams.get('search') || '').trim();
  selectedCategory = initialParams.get('category') || '';
  eventSearch.value = searchQuery;
  const initialDate = initialParams.get('date') || '';
  if ([...dateFilter.options].some((o) => o.value === initialDate)) dateFilter.value = initialDate;

  const FILTER_LABELS = {
    date: { today: 'Today', 'this-week': 'This week', 'this-month': 'This month', upcoming: 'Upcoming' },
    price: { free: 'Free', paid: 'Paid' },
    availability: { available: 'Seats available', waitlist: 'Waitlist only' },
    sort: { popular: 'Most popular', 'date-desc': 'Date (latest)' }
  };

  function activeFilters() {
    const chips = [];
    if (searchQuery) chips.push({ key: 'search', label: `“${searchQuery}”` });
    if (selectedCategory) chips.push({ key: 'category', label: selectedCategory });
    if (dateFilter.value) chips.push({ key: 'date', label: FILTER_LABELS.date[dateFilter.value] || dateFilter.value });
    if (priceFilter.value) chips.push({ key: 'price', label: FILTER_LABELS.price[priceFilter.value] });
    if (availabilityFilter.value) chips.push({ key: 'availability', label: FILTER_LABELS.availability[availabilityFilter.value] });
    if (sortFilter.value !== 'date') chips.push({ key: 'sort', label: FILTER_LABELS.sort[sortFilter.value] });
    if (nearMeActive) chips.push({ key: 'near', label: 'Near me' });
    return chips;
  }

  function clearFilter(key) {
    if (key === 'search') { searchQuery = ''; eventSearch.value = ''; }
    if (key === 'category') { selectedCategory = ''; syncCategoryChips(); }
    if (key === 'date') dateFilter.value = '';
    if (key === 'price') priceFilter.value = '';
    if (key === 'availability') availabilityFilter.value = '';
    if (key === 'sort') sortFilter.value = 'date';
    if (key === 'near') { nearMeRequestId += 1; userLocation = null; nearMeActive = false; clearLocationBtn.classList.add('hidden'); }
  }

  function renderActiveFilters() {
    const chips = activeFilters();
    filterCount.hidden = chips.length === 0;
    filterCount.textContent = String(chips.length);
    activeFiltersRow.hidden = chips.length === 0;
    activeFilterChips.innerHTML = chips
      .map((chip) => `<button type="button" class="active-filter-chip" data-clear-filter="${chip.key}">${escapeHtml(chip.label)} <span aria-hidden="true">✕</span><span class="visually-hidden">Remove filter</span></button>`)
      .join('');
    activeFilterChips.querySelectorAll('[data-clear-filter]').forEach((btn) => {
      btn.addEventListener('click', () => {
        clearFilter(btn.getAttribute('data-clear-filter'));
        loadEvents();
      });
    });
    // Keep the address bar shareable.
    const params = new URLSearchParams();
    if (searchQuery) params.set('search', searchQuery);
    if (selectedCategory) params.set('category', selectedCategory);
    if (dateFilter.value) params.set('date', dateFilter.value);
    const query = params.toString();
    window.history.replaceState({}, '', query ? `events.html?${query}` : 'events.html');
  }

  function syncCategoryChips() {
    categoryChips.querySelectorAll('[data-category]').forEach((b) => {
      const match = (b.getAttribute('data-category') || '') === selectedCategory;
      b.classList.toggle('active', match);
      b.setAttribute('aria-selected', String(match));
    });
  }


  function personaliseDiscoveryIntro() {
    const user = Session.getUser();
    if (Session.isLoggedIn() && user && user.name) {
      const firstName = String(user.name).split(' ')[0] || 'there';
      eventsTitle.textContent = `Hi, ${firstName} 👋`;
      eventsSubtitle.textContent = 'Discover events you\'ll love';
    }
  }

  function buildQuery() {
    const params = new URLSearchParams();
    params.set('upcoming', 'true');
    if (selectedCategory) params.set('category', selectedCategory);
    if (searchQuery) params.set('search', searchQuery);
    if (priceFilter.value) params.set('price', priceFilter.value);
    if (availabilityFilter.value) params.set('availability', availabilityFilter.value);
    if (sortFilter.value && sortFilter.value !== 'date') params.set('sort', sortFilter.value);
    const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const now = new Date();
    if (dateFilter.value === 'today') {
      params.set('date', isoDay(now));
      params.set('dateTo', isoDay(now));
    } else if (dateFilter.value === 'this-week') {
      const end = new Date(now); end.setDate(now.getDate() + 6);
      params.set('date', isoDay(now));
      params.set('dateTo', isoDay(end));
    } else if (dateFilter.value === 'this-month') {
      const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      params.set('date', isoDay(now));
      params.set('dateTo', isoDay(end));
    }
    return `?${params.toString()}`;
  }

  function enrichWithDistance(events) {
    const canSort = Boolean(
      nearMeActive && userLocation && userLocation.quality &&
      userLocation.quality.sortable &&
      isValidCoordinatePair(userLocation.latitude, userLocation.longitude)
    );

    const enriched = events.map((event) => {
      const hasEventCoordinates = isValidCoordinatePair(event.latitude, event.longitude);
      const distance = canSort && hasEventCoordinates
        ? distanceInKm(userLocation.latitude, userLocation.longitude, event.latitude, event.longitude)
        : null;
      return { ...event, distanceKm: distance, distanceApproximate: Boolean(userLocation && userLocation.quality && userLocation.quality.approximate && canSort) };
    });

    if (!canSort) return enriched;
    return enriched.sort((a, b) => (a.distanceKm ?? Number.MAX_SAFE_INTEGER) - (b.distanceKm ?? Number.MAX_SAFE_INTEGER));
  }

  function distanceBadge(event) {
    if (!Number.isFinite(event.distanceKm)) return '';
    const prefix = event.distanceApproximate ? '≈ ' : '';
    return `<span class="badge badge-location">📍 ${prefix}${formatDistance(event.distanceKm)}</span>`;
  }

  function eventPrice(event) {
    return event && Number.isFinite(Number(event.price)) && Number(event.price) > 0 ? `₹${Number(event.price)}` : 'Free';
  }

  let savedEventIds = new Set();

  async function loadSavedEventIds() {
    if (!Session.isLoggedIn()) {
      savedEventIds = new Set();
      return;
    }
    try {
      const res = await Api.getSavedEventIds();
      savedEventIds = new Set((res.eventIds || []).map(String));
    } catch (err) {
      savedEventIds = new Set();
    }
  }

  function renderEventCard(event, containerType = 'main') {
    const spotsLeft = Number(event.capacity || 0) - Number(event.bookedCount || 0);
    const full = spotsLeft <= 0;
    const safeImg = event.imageUrl ? optimizedImageUrl(event.imageUrl, 500).replace(/"/g, '"') : '';
    const date = new Date(event.date);
    const saved = savedEventIds.has(event.id);

    const clubInfo = event.club ? `<span class="event-club">🏷️ ${escapeHtml(event.club.name)}</span>` : '';
    const organizerInfo = event.organizer ? `<span class="event-organizer">👤 ${escapeHtml(event.organizer.name)}</span>` : '';

    return `<article class="event-card">
      <button type="button" class="save-heart ${saved ? 'saved' : ''}" data-save-event="${escapeHtml(event.id)}" aria-label="${saved ? 'Remove saved event' : 'Save event'}">
        <span class="heart-icon" aria-hidden="true">${saved ? '♥' : '♡'}</span>
      </button>
      <a href="event-details.html?id=${event.id}" class="event-card-link">
        <div class="thumb">
          ${event.imageUrl ? `<img src="${safeImg}" alt="${escapeHtml(event.title)}" loading="lazy" decoding="async" class="thumb-img" />` : `<span class="cat-badge">${escapeHtml((event.category || 'E').charAt(0))}</span>`}
          <div class="event-date-chip" aria-label="Event date"><strong>${date.toLocaleDateString(undefined, { day: '2-digit' })}</strong><span>${date.toLocaleDateString(undefined, { month: 'short' })}</span></div>
          <span class="badge spots-badge ${full ? 'badge-danger' : 'badge-success'}">${full ? 'Full' : spotsLeft + ' left'}</span>
        </div>
        <div class="body">
          <div class="event-card-topline"><span class="badge badge-primary">${escapeHtml(event.category || 'Event')}</span><span class="event-time">${escapeHtml(event.time || '')}</span></div>
          <h3>${escapeHtml(event.title)}</h3>
          <div class="meta"><span>📅 ${formatDate(event.date)}</span><span>📍 ${escapeHtml(event.location)}</span>${distanceBadge(event)}</div>
          <div class="premium-meta"><span class="event-price">${escapeHtml(eventPrice(event))}</span><span class="badge badge-muted">${event.bookedCount || 0}/${event.capacity || 0} booked</span></div>
          <div class="event-host">${clubInfo}${organizerInfo}</div>
        </div>
        <div class="footer"><span class="event-card-footnote">${full ? 'Join the waitlist from details' : 'Seats available'}</span><span class="btn btn-sm btn-outline event-card-cta">View details <span aria-hidden="true">→</span></span></div>
      </a>
    </article>`;
  }

  function bindSaveButtons() {
    document.querySelectorAll('[data-save-event]').forEach((btn) => {
      btn.addEventListener('click', async (event) => {
        event.preventDefault(); event.stopPropagation();
        const id = btn.getAttribute('data-save-event');
        const wasSaved = savedEventIds.has(id);
        try {
          if (wasSaved) {
            await Api.removeSavedEvent(id);
            savedEventIds.delete(id);
            showToast('Removed from saved events');
          } else {
            await Api.saveEvent(id);
            savedEventIds.add(id);
            showToast('Saved event');
          }
          btn.classList.toggle('saved', !wasSaved);
          btn.querySelector('.heart-icon').textContent = wasSaved ? '♡' : '♥';
          btn.setAttribute('aria-label', wasSaved ? 'Save event' : 'Remove saved event');
        } catch (err) {
          showAlert(alertBox, err.message);
        }
      });
    });
  }


  function renderSkeletons(count = 6) {
    const skeleton = `<div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-line short"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>`;
    eventsGrid.innerHTML = skeleton.repeat(count);
  }

  function renderEvents(events) {
    resultsSection.classList.remove('hidden-results');
    if (!events.length) {
      resultsSummary.textContent = '0 events found';
      eventsGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">🔍</div><h3>No events match those filters</h3><p>Try clearing a filter, widening the date range or searching a different keyword.</p></div>`;
      return;
    }
    resultsSummary.textContent = `${events.length} event${events.length === 1 ? '' : 's'} found`;
    eventsGrid.innerHTML = events.map(renderEventCard).join('');
    bindSaveButtons();
  }

  async function loadEvents() {
    renderActiveFilters();
    const hasIntent = Boolean(searchQuery || selectedCategory || dateFilter.value || priceFilter.value || availabilityFilter.value || sortFilter.value !== 'date' || nearActive);
    if (!hasIntent) {
      clearAlert(alertBox);
      resultsSection.classList.remove('hidden-results');
      resultsSummary.textContent = '';
      eventsGrid.innerHTML = `<div class="event-discovery-empty search-first-state" style="grid-column:1/-1"><div class="icon">🔎</div><h3>Search campus life.</h3><p>Type an event, club or venue, or choose a category/filter to see matching events.</p></div>`;
      return;
    }
    try {
      clearAlert(alertBox);
      resultsSection.classList.remove('hidden-results');
      renderSkeletons();
      await loadSavedEventIds();
      const response = await Api.getEvents(buildQuery());
      allEvents = enrichWithDistance(response.events || []);
      renderEvents(allEvents);
    } catch (err) {
      resultsSection.classList.remove('hidden-results');
      resultsSummary.textContent = 'Could not load events';
      showAlert(alertBox, err.message);
      eventsGrid.innerHTML = '';
    }
  }

  async function loadCategories() {
    try {
      const { categories } = await Api.getCategories();
      allCategories = categories.filter(c => c.status === 'active');
      categoryChips.innerHTML = `
        <button type="button" class="category-chip ${!selectedCategory ? 'active' : ''}" data-category="" role="tab" aria-selected="${!selectedCategory}">All</button>
        ${allCategories.map((c) => `
          <button type="button" class="category-chip ${selectedCategory === c.name ? 'active' : ''}" data-category="${escapeHtml(c.name)}" role="tab" aria-selected="${selectedCategory === c.name}">
            <span aria-hidden="true">${escapeHtml(c.icon || '📁')}</span> ${escapeHtml(c.name)}
          </button>`).join('')}
      `;

      categoryChips.querySelectorAll('[data-category]').forEach((button) => {
        button.addEventListener('click', () => {
          selectedCategory = button.getAttribute('data-category') || '';
          categoryChips.querySelectorAll('[data-category]').forEach(b => {
            b.classList.toggle('active', b.getAttribute('data-category') === selectedCategory);
            b.setAttribute('aria-selected', b.getAttribute('data-category') === selectedCategory);
          });
          loadEvents();
        });
      });
    } catch (err) {
      categoryChips.innerHTML = '<div class="event-discovery-empty"><h3>Categories unavailable</h3><p>Please try again in a moment.</p></div>';
    }
  }

  function debounce(fn, delay) {
    let timeoutId;
    return (...args) => {
      clearTimeout(timeoutId);
      timeoutId = setTimeout(() => fn(...args), delay);
    };
  }

  const debouncedSearch = debounce(() => {
    searchQuery = eventSearch.value.trim();
    loadEvents();
  }, 300);

  clearFiltersBtn.addEventListener('click', () => {
    ['search','category','date','price','availability','sort','near'].forEach(clearFilter);
    locationStatus.textContent = 'Use your current location only when you want nearby sorting.';
    nearMeBtn.textContent = '📍 Near Me';
    loadEvents();
  });

  filterToggle.addEventListener('click', () => {
    const open = eventFilters.classList.toggle('is-open');
    filterToggle.setAttribute('aria-expanded', String(open));
    filterToggle.classList.toggle('active', open);
  });

  eventSearch.addEventListener('input', debouncedSearch);
  dateFilter.addEventListener('change', loadEvents);
  priceFilter.addEventListener('change', loadEvents);
  availabilityFilter.addEventListener('change', loadEvents);
  sortFilter.addEventListener('change', loadEvents);

  nearMeBtn.addEventListener('click', async () => {
    const requestId = ++nearMeRequestId;
    nearMeBtn.disabled = true;
    nearMeBtn.textContent = '📍 Finding you...';
    clearAlert(alertBox);
    locationStatus.textContent = 'Requesting your current location...';
    try {
      const location = await getCurrentPosition();
      if (requestId !== nearMeRequestId) return;
      userLocation = { latitude: Number(location.latitude), longitude: Number(location.longitude), accuracy: Number(location.accuracy), quality: location.quality || getLocationAccuracyQuality(Number(location.accuracy)) };
      nearMeActive = Boolean(userLocation.quality && userLocation.quality.sortable);
      const accuracyKm = Number(userLocation.accuracy) / 1000;
      if (userLocation.quality.level === 'excellent') locationStatus.textContent = 'Location found. Showing events closest to you first.';
      else if (userLocation.quality.level === 'moderate') locationStatus.textContent = `Location found, but accuracy is moderate (about ±${Math.round(accuracyKm * 10) / 10} km). Distances are approximate.`;
      else { locationStatus.textContent = `Location found, but accuracy is poor (about ±${Math.round(accuracyKm)} km). Nearby sorting is temporarily unavailable.`; nearMeActive = false; }
      nearMeBtn.textContent = nearMeActive ? '✓ Near Me is on' : '↻ Retry Near Me';
      clearLocationBtn.classList.remove('hidden');
      loadEvents();
    } catch (err) {
      if (requestId !== nearMeRequestId) return;
      userLocation = null; nearMeActive = false; locationStatus.textContent = err.message; showAlert(alertBox, err.message); nearMeBtn.textContent = '📍 Retry Near Me';
    } finally {
      if (requestId === nearMeRequestId) nearMeBtn.disabled = false;
    }
  });

  clearLocationBtn.addEventListener('click', () => {
    nearMeRequestId += 1; userLocation = null; nearMeActive = false;
    locationStatus.textContent = 'Use your current location only when you want nearby sorting.';
    nearMeBtn.textContent = '📍 Near Me'; clearLocationBtn.classList.add('hidden');
    loadEvents();
  });

  personaliseDiscoveryIntro();
  loadCategories();
  loadEvents();
  }
</script>
</body>
</html>
