<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Set New Password - EventHub</title><link rel="stylesheet" href="css/style.css?v=37"/>
<link rel="stylesheet" href="css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="css/mobile-polish.css?v=52">
<link rel="stylesheet" href="css/eventhub-v61.css?v=61">
  <link rel="stylesheet" href="css/mobile-v63.css?v=63.1">
</head><body><div id="navbar" class="navbar"></div><div class="auth-wrapper"><div class="auth-card"><div class="auth-icon">✦</div><h1>Choose a new password</h1><p class="tagline">Make it memorable and keep it private.</p><div class="auth-box"><div id="alertBox"></div><form id="resetForm"><div class="form-group"><label for="password">New password</label><input id="password" class="form-control" type="password" minlength="6" required/></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" class="form-control" type="password" minlength="6" required/></div><button id="submitBtn" class="btn btn-primary btn-block" type="submit">Update password</button></form></div></div></div><script src="js/api.js"></script><script src="js/nav.js"></script><script>renderNavbar('login');const token=new URLSearchParams(window.location.search).get('token')||'',form=document.getElementById('resetForm'),alertBox=document.getElementById('alertBox'),submitBtn=document.getElementById('submitBtn');if(!token){showAlert(alertBox,'This password reset link is missing or invalid.');submitBtn.disabled=true;}form.addEventListener('submit',async(e)=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirmPassword').value){showAlert(alertBox,'Passwords do not match.');return;}submitBtn.disabled=true;try{const result=await Api.resetPassword(token,password);showAlert(alertBox,result.message,'success');form.reset();setTimeout(()=>{window.location.href='login.html';},1400);}catch(err){showAlert(alertBox,err.message);submitBtn.disabled=false;}});</script></body></html>
