<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Bookings - EventHub</title>
<link rel="stylesheet" href="css/style.css?v=37" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

<link rel="stylesheet" href="css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="css/mobile-polish.css?v=52">
<link rel="stylesheet" href="css/eventhub-v61.css?v=61">
  <link rel="stylesheet" href="css/mobile-v63.css?v=63.1">
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container">
  <div class="page-header">
    <div>
      <h1>My Bookings</h1>
      <p>All the events you've registered for.</p>
    </div>
  </div>

  <div id="alertBox"></div>
  <div id="bookingsList" class="grid grid-2"></div>
</div>

<footer class="site-footer">EventHub &mdash; Event Management System</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  requireAuth();
  renderNavbar('bookings');

  const bookingsList = document.getElementById('bookingsList');
  const alertBox = document.getElementById('alertBox');

  function statusBadge(status) {
    const map = {
      confirmed: 'badge-success',
      pending: 'badge-warning',
      cancelled: 'badge-muted',
      rejected: 'badge-danger'
    };
    return `<span class="badge ${map[status] || 'badge-muted'}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
  }

  function renderBookings(bookings) {
    if (!bookings.length) {
      bookingsList.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <div class="icon">🎟️</div>
        <h3>No bookings yet</h3>
        <p>Browse events and book your first one.</p>
        <a href="events.html" class="btn btn-primary" style="margin-top:12px;">Browse Events</a>
      </div>`;
      return;
    }

    bookingsList.innerHTML = bookings.map((b) => {
      const event = b.event;
      if (!event) {
        return `<div class="card"><p>Event no longer available.</p> ${statusBadge(b.status)}</div>`;
      }
      const canCancel = b.status === 'confirmed' || b.status === 'pending';
      return `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div>
              <span class="badge badge-primary">${escapeHtml(event.category)}</span>
              <h3 style="margin:8px 0 4px;">${escapeHtml(event.title)}</h3>
              <div style="color:var(--text-muted); font-size:0.88rem;">
                📅 ${formatDate(event.date)} at ${escapeHtml(event.time)}<br/>
                📍 ${escapeHtml(event.location)}
              </div>
            </div>
            ${statusBadge(b.status)}
          </div>
          <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
            <a href="event-details.html?id=${event.id}" class="btn btn-outline btn-sm">View Event</a>
            ${canCancel ? `<button class="btn btn-danger btn-sm" data-cancel="${b.id}">Cancel Booking</button>` : ''}
            ${b.status === 'confirmed' ? `<a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="${escapeHtml(googleCalendarUrl(event))}">Google Calendar</a><button class="btn btn-outline btn-sm" data-calendar="${b.id}">Download .ics</button><button class="btn btn-primary btn-sm" data-pass="${b.id}">Event Pass</button><button class="btn btn-outline btn-sm" data-share="${b.id}">Share</button>` : ''}
          </div>
        </div>
      `;
    }).join('');

    document.querySelectorAll('[data-pass]').forEach((btn) => { const booking = bookings.find((item) => item.id === btn.getAttribute('data-pass')); if (booking) btn.addEventListener('click', () => showEventPass(booking)); });
    document.querySelectorAll('[data-share]').forEach((btn) => { const booking = bookings.find((item) => item.id === btn.getAttribute('data-share')); if (booking) btn.addEventListener('click', async () => { try { const result = await shareEvent(booking.event); showToast(result === 'shared' ? 'Share sheet opened.' : 'Event link copied.'); } catch (e) { showToast('Could not share event.', 'error'); } }); });
    document.querySelectorAll('[data-calendar]').forEach((btn) => {
      const booking = bookings.find((item) => item.id === btn.getAttribute('data-calendar'));
      if (booking && booking.event) btn.addEventListener('click', () => downloadCalendarEvent(booking.event));
    });

    document.querySelectorAll('[data-cancel]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Cancel this booking?')) return;
        btn.disabled = true;
        btn.textContent = 'Cancelling...';
        try {
          await Api.cancelBooking(btn.getAttribute('data-cancel'));
          load();
        } catch (err) {
          showAlert(alertBox, err.message);
          btn.disabled = false;
          btn.textContent = 'Cancel Booking';
        }
      });
    });
  }

  function showEventPass(booking) { const e=booking.event; const overlay=document.createElement('div'); overlay.className='event-pass-overlay'; overlay.innerHTML=`<div class="event-pass"><button class="event-pass-close" aria-label="Close">×</button><span class="eyebrow">EVENT PASS</span><h2>${escapeHtml(e.title)}</h2><p class="muted">${formatDate(e.date)} · ${escapeHtml(e.time)} · ${escapeHtml(e.location)}</p><div id="bookingQr" class="event-pass-qr"></div><div class="event-pass-code">${escapeHtml(booking.checkInCode || '—')}</div><p>Show the QR code or code at the event check-in desk.</p><button class="btn btn-primary" onclick="window.print()">Print pass</button></div>`; document.body.appendChild(overlay); if(window.QRCode && booking.checkInCode) new QRCode(document.getElementById('bookingQr'),{text:booking.checkInCode,width:180,height:180}); overlay.querySelector('.event-pass-close').onclick=()=>overlay.remove(); overlay.onclick=(ev)=>{if(ev.target===overlay)overlay.remove()}; }

  async function load() {
    try {
      clearAlert(alertBox);
      const { bookings } = await Api.getMyBookings();
      renderBookings(bookings);
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  }

  load();
</script>
</body>
</html>
