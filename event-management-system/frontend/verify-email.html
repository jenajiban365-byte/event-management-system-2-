<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Verify Email - EventHub</title><link rel="stylesheet" href="css/style.css"/></head><body><div id="navbar" class="navbar"></div><div class="auth-wrapper"><div class="auth-card"><div class="auth-icon">✓</div><h1 id="heading">Verifying your email</h1><p id="message" class="tagline">One moment while we confirm your account.</p><a class="btn btn-primary btn-block" href="login.html">Continue to sign in</a></div></div><script src="js/api.js"></script><script src="js/nav.js"></script><script>renderNavbar('login');const token=new URLSearchParams(window.location.search).get('token')||'';if(!token){document.getElementById('heading').textContent='Invalid verification link';document.getElementById('message').textContent='This verification link is missing or invalid.';}else{Api.verifyEmail(token).then(result=>{document.getElementById('heading').textContent='Email verified';document.getElementById('message').textContent=result.message;}).catch(err=>{document.getElementById('heading').textContent='Verification link expired';document.getElementById('message').textContent=err.message;});}</script></body></html>
