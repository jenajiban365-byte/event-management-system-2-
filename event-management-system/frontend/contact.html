<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us - EventHub</title>
<meta name="description" content="Get in touch with the EventHub team — questions, feedback, or support." />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0b0d12" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container" style="max-width:640px;">
  <div class="page-header">
    <div>
      <h1>Contact Us</h1>
      <p>Questions, feedback, or need a hand with something? Send us a message and we'll get back to you.</p>
    </div>
  </div>

  <div class="card">
    <div id="alertBox"></div>
    <form id="contactForm">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" class="form-control" placeholder="Jane Doe" required maxlength="200" />
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" class="form-control" placeholder="What's this about?" required maxlength="200" />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" class="form-control" rows="6" placeholder="Tell us more..." required maxlength="5000"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send Message</button>
    </form>
  </div>

  <p style="text-align:center; color:var(--text-muted); font-size:.85rem; margin-top:20px;">
   You can also reach us anytime at <a href="mailto:jenajiban365@gmail.com" style="color:var(--accent);">jenajiban365@gmail.com</a>
  </p>
</div>

<footer class="site-footer">EventHub &mdash; Event Management System</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch((err) => console.error('Service worker registration failed.', err));
  }
</script>
<script>
  renderNavbar('contact');

  const form = document.getElementById('contactForm');
  const alertBox = document.getElementById('alertBox');
  const submitBtn = document.getElementById('submitBtn');

  // Pre-fill name/email if the visitor is logged in — one less thing to type
  (function prefillFromSession() {
    const user = Session.getUser();
    if (user) {
      document.getElementById('name').value = user.name || '';
      document.getElementById('email').value = user.email || '';
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert(alertBox);
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    try {
      const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        subject: document.getElementById('subject').value.trim(),
        message: document.getElementById('message').value.trim()
      };
      const result = Session.isLoggedIn()
        ? await Api.createSupportTicket({ subject: payload.subject, message: payload.message })
        : await Api.submitContactForm(payload);
      showAlert(alertBox, result.message, 'success');
      form.reset();
      // Re-prefill after reset, if logged in
      const user = Session.getUser();
      if (user) {
        document.getElementById('name').value = user.name || '';
        document.getElementById('email').value = user.email || '';
      }
    } catch (err) {
      showAlert(alertBox, err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Message';
    }
  });
</script>
</body>
</html>
