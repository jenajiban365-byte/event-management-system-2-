<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Details - EventHub</title>
<meta name="description" content="View event details, availability, and booking options on EventHub." />
<meta property="og:title" content="Event details - EventHub" />
<meta property="og:description" content="Discover your next experience and reserve a spot." />
<meta property="og:type" content="website" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#fffaf0" />
<link rel="stylesheet" href="css/style.css?v=37" />

<link rel="stylesheet" href="css/eventhub-premium.css?v=48">
<link rel="stylesheet" href="css/mobile-polish.css?v=52">
<link rel="stylesheet" href="css/eventhub-v61.css?v=61">
  <link rel="stylesheet" href="css/mobile-v63.css?v=63.1">
</head>
<body>
<div id="navbar" class="navbar"></div>

<div class="container event-details-page" style="max-width:860px;">
  <a href="events.html" style="color:var(--text-muted); font-size:0.9rem;">&larr; Back to Events</a>
  <div id="alertBox" style="margin-top:16px;"></div>
  <div id="content"></div>
  <div id="similarEvents"></div>
</div>

<footer class="site-footer">EventHub &mdash; Event Management System</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  requireAuth();
  renderNavbar('events');

  const content = document.getElementById('content');
  const alertBox = document.getElementById('alertBox');
  const similarEventsEl = document.getElementById('similarEvents');
  const params = new URLSearchParams(window.location.search);
  const eventId = params.get('id');

  async function loadEvent() {
    if (!eventId) {
      showAlert(alertBox, 'No event specified.');
      return;
    }
    try {
      const { event } = await Api.getEvent(eventId);
      renderEvent(event);
      setupEventMoments(event);
      loadSimilarEvents(event);
    } catch (err) {
      showAlert(alertBox, err.message);
    }
  }

  async function loadSimilarEvents(event) {
    try {
      const query = `?category=${encodeURIComponent(event.category)}&excludeId=${event.id}&upcoming=true&limit=3`;
      const { events } = await Api.getEvents(query);
      if (!events.length) {
        similarEventsEl.innerHTML = '';
        return;
      }
      similarEventsEl.innerHTML = `
        <div class="section-title">You might also like</div>
        <div class="grid grid-3">
          ${events.map((e) => {
            const spotsLeft = e.capacity - e.bookedCount;
            const full = spotsLeft <= 0;
            const safeImg = e.imageUrl ? optimizedImageUrl(e.imageUrl, 500).replace(/"/g, '&quot;') : '';
            return `
              <a href="event-details.html?id=${e.id}" class="event-card">
                <div class="thumb">
                  ${e.imageUrl
                    ? `<img src="${safeImg}" alt="${escapeHtml(e.title)}" loading="lazy" decoding="async" class="thumb-img" />`
                    : `<span class="cat-badge">${escapeHtml(e.category.charAt(0))}</span>`}
                  <span class="badge spots-badge ${full ? 'badge-danger' : 'badge-success'}">${full ? 'Full' : spotsLeft + ' left'}</span>
                </div>
                <div class="body">
                  <span class="badge badge-primary">${escapeHtml(e.category)}</span>
                  <h3>${escapeHtml(e.title)}</h3>
                  <div class="meta">
                    <span>📅 ${formatDate(e.date)} at ${escapeHtml(e.time)}</span>
                    <span>📍 ${escapeHtml(e.location)}</span>
                  </div>
                </div>
                <div class="footer">
                  <span class="badge badge-muted">${e.bookedCount}/${e.capacity} booked</span>
                  <span class="btn btn-sm btn-outline">View Details</span>
                </div>
              </a>
            `;
          }).join('')}
        </div>
      `;
    } catch (err) {
      similarEventsEl.innerHTML = ''; // non-critical — fail silently, don't disrupt the main page
    }
  }

function renderEvent(event) {
    const organizerName = event.organizer?.name || event.organizer?.email || 'EventHub Team';
    const clubName = event.club?.name || event.club?.shortName || '';
    const spotsLeft = event.capacity - event.bookedCount;
    const hasSmartForm = event.registrationForm?.enabled === true;
    const needsFullForm = hasSmartForm || (Array.isArray(event.customRegistrationQuestions) && event.customRegistrationQuestions.some(q => q.type === 'file' || (q.showWhen && q.showWhen.questionIndex !== null && q.showWhen.questionIndex !== undefined && q.showWhen.questionIndex !== '')));
    const full = spotsLeft <= 0;
    const loggedIn = Session.isLoggedIn();
    const price = event.price && Number(event.price) > 0 ? `₹${Number(event.price)}` : 'Free';

    content.innerHTML = `
      <div class="card event-detail-card">
        <div class="event-detail-hero">
          ${event.imageUrl
            ? `<img src="${optimizedImageUrl(event.imageUrl, 900).replace(/"/g, '"')}" alt="${escapeHtml(event.title)}" loading="lazy" decoding="async" />`
            : `<span aria-hidden="true">${escapeHtml(event.category.charAt(0))}</span>`}
          <span class="badge badge-primary hero-category">${escapeHtml(event.category)}</span>
          <span class="badge badge-location hero-place-badge">${escapeHtml(event.location)}</span>
        </div>
        <div class="event-detail-content">
          <div class="event-detail-header">
            <div>
              <span class="badge badge-primary">${escapeHtml(event.category)}</span>
              <h1>${escapeHtml(event.title)}</h1>
            </div>
            <div class="detail-header-actions">
              <a href="events.html" class="btn btn-outline btn-sm">← Back to events</a>
            </div>
          </div>
          <div class="event-detail-info">
            <span class="info-chip">📅 ${formatDate(event.date)} at ${escapeHtml(event.time)}</span>
            <span class="info-chip">📍 ${escapeHtml(event.location)}</span>
            <span class="info-chip">👥 ${event.bookedCount}/${event.capacity} booked</span>
            <span class="info-chip">🎟️ ${escapeHtml(price)}</span>
          </div>
          <div class="event-detail-body">
            <p>${escapeHtml(event.description)}</p>
          </div>
          <div class="event-detail-grid">
            <div class="event-detail-panel">
              <div class="event-detail-panel-title">Event details</div>
              <div class="detail-list">
                <div><span>Venue</span><strong>${escapeHtml(event.location)}</strong></div>
                <div><span>Date & time</span><strong>${formatDate(event.date)} • ${escapeHtml(event.time)}</strong></div>
                <div><span>Availability</span><strong>${Math.max(0, spotsLeft)} / ${event.capacity} spots left</strong></div>
                <div><span>Organized by</span><strong>${escapeHtml(clubName || organizerName)}</strong></div>
                <div><span>Event contact</span><strong>${escapeHtml(organizerName)}</strong></div>
              </div>
            </div>
            <div class="event-detail-panel emphasis-panel">
              <div class="event-detail-panel-title">Registration</div>
              <div class="booking-summary">
                <span>${Math.max(0, spotsLeft)} seats remaining</span>
                <strong>${price}</strong>
              </div>
              <div class="event-availability">
                <div class="availability-heading"><span>Availability</span><strong>${Math.max(0, spotsLeft)} of ${event.capacity} spots left</strong></div>
                <div class="availability-track" role="progressbar" aria-label="Event availability" aria-valuemin="0" aria-valuemax="${event.capacity}" aria-valuenow="${Math.max(0, spotsLeft)}"><span style="width:${Math.min(100, Math.max(0, (spotsLeft / event.capacity) * 100))}%"></span></div>
              </div>
            </div>
          </div>
          ${loggedIn && Array.isArray(event.customRegistrationQuestions) && event.customRegistrationQuestions.length && !needsFullForm ? `<div class="registration-questions-panel"><div class="event-detail-panel-title">Quick registration</div><p class="muted">A few details from the organizer before you book.</p><div id="registrationQuestions" class="registration-questions">${event.customRegistrationQuestions.map((q,i)=>{const type=q.type||'text';const req=q.required !== false?'required':'';let control='';if(type==='textarea') control=`<textarea class="form-control registration-answer" data-question-index="${i}" ${req} placeholder="Your answer"></textarea>`;else if(type==='select') control=`<select class="form-control registration-answer" data-question-index="${i}" ${req}><option value="">Choose an option</option>${(q.options||[]).map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}</select>`;else if(type==='checkbox') control=`<label class="check-row"><input type="checkbox" class="registration-answer registration-checkbox" data-question-index="${i}" value="Yes" ${req}> Yes</label>`;else control=`<input class="form-control registration-answer" data-question-index="${i}" ${req} placeholder="Your answer">`;return `<div class="registration-question"><span>${escapeHtml(q.question)}${q.required !== false ? ' *' : ''}</span>${control}</div>`}).join('')}</div></div>` : ''}
          <div class="event-detail-actions">
            <span class="badge ${full ? 'badge-danger' : 'badge-success'}">${full ? 'Fully Booked' : spotsLeft + ' spots left'}</span>
            ${full ? `<button id="waitlistBtn" class="btn btn-primary" type="button">${loggedIn ? 'Join Waitlist' : 'Login to Join Waitlist'}</button>` : needsFullForm && loggedIn ? `<a id="bookBtn" class="btn btn-primary" href="${hasSmartForm ? `smart-form.html?event=${encodeURIComponent(event.id)}` : `event-form.html?id=${encodeURIComponent(event.id)}`}">${hasSmartForm ? 'Open Campus Smart Form →' : 'Open registration form →'}</a>` : `<button id="bookBtn" class="btn btn-primary">${loggedIn ? 'Book This Event' : 'Login to Book'}</button>`}
            ${loggedIn && !full && !needsFullForm ? `<a class="btn btn-outline" href="${hasSmartForm ? `smart-form.html?event=${encodeURIComponent(event.id)}` : `event-form.html?id=${encodeURIComponent(event.id)}`}">${hasSmartForm ? 'Open Campus Smart Form →' : 'Open full form →'}</a>` : ''}
            <a id="googleCalendarBtn" class="btn btn-outline" href="${escapeHtml(googleCalendarUrl(event))}" target="_blank" rel="noopener">Google Calendar</a>
            <button id="calendarBtn" class="btn btn-outline" type="button">Download .ics</button>
            <button id="saveDetailBtn" class="btn btn-outline save-detail-action" type="button">♡ Save event</button>
            <button id="shareBtn" class="btn btn-outline" type="button">Share event</button>
            <button id="shareRegistrationBtn" class="btn btn-primary" type="button">Share registration form</button>
          </div>
          ${full && loggedIn ? `<div id="waitlistStatus" style="margin-top:12px;color:var(--text-muted)"></div>` : ''}

          <section class="event-moments-panel" id="eventMomentsPanel">
            <div class="event-moments-head"><div><span class="event-buddy-kicker">📸 EVENT MOMENTS</span><h2>What happened here?</h2><p>Share a photo or short note with students who were part of this event.</p></div><button id="momentAddBtn" class="btn btn-outline btn-sm" type="button">+ Add a moment</button></div>
            <div id="momentComposer" class="moment-composer" hidden><textarea id="momentCaption" class="form-control" maxlength="280" placeholder="One line about the moment…"></textarea><div class="moment-upload-row"><label class="btn btn-outline btn-sm moment-file-label">📷 Add photo<input id="momentFile" type="file" accept="image/*" hidden></label><span id="momentFileName">No photo selected</span><button id="momentPostBtn" class="btn btn-primary btn-sm" type="button">Share moment →</button></div></div>
            <div id="momentRail" class="moment-rail"><div class="pulse-loading">Loading moments…</div></div>
          </section>

          ${loggedIn ? `<section id="eventBuddyPanel" class="event-buddy-panel" hidden><div class="event-buddy-kicker">🤝 EVENT BUDDY</div><div class="event-buddy-head"><div><h3>You're not going alone.</h3><p>Meet students who are also coming. Only people who opted in appear here.</p></div><span class="event-buddy-spark">✦</span></div><div id="eventBuddyList" class="event-buddy-list"></div></section>` : ''}
        </div>
      </div>
    `;

    const bookBtn = document.getElementById('bookBtn');
    const waitlistBtn = document.getElementById('waitlistBtn');
    const waitlistStatus = document.getElementById('waitlistStatus');
    const calendarBtn = document.getElementById('calendarBtn');
    const shareBtn = document.getElementById('shareBtn');
    const shareRegistrationBtn = document.getElementById('shareRegistrationBtn');
    const saveBtn = document.getElementById('saveDetailBtn');
    const buddyPanel = document.getElementById('eventBuddyPanel');
    const buddyList = document.getElementById('eventBuddyList');
    async function syncExistingBookingState(){
      if(!loggedIn || !bookBtn || full) return;
      try {
        const mine = await Api.getMyBookings();
        const existing = (mine.bookings || []).find(b => String(b.event?.id || b.event?._id || b.event) === String(event.id) && b.status !== 'cancelled');
        if(existing){
          bookBtn.outerHTML = '<a id="bookBtn" class="btn btn-primary" href="my-bookings.html">✓ Already registered · View pass</a>';
          const formLinks = document.querySelectorAll('.event-detail-actions a[href*="event-form.html"]');
          formLinks.forEach(a => { a.textContent='View registration details →'; a.classList.remove('btn-primary'); a.classList.add('btn-outline'); });
        }
      } catch(e){ /* registration state is a convenience; don't block event details */ }
    }
    syncExistingBookingState();
    async function loadEventBuddies(){
      if(!buddyPanel) return;
      try {
        const data = await Api.getEventBuddies(event.id);
        if(!data.buddies?.length){ buddyPanel.hidden=false; buddyList.innerHTML='<div class="event-buddy-empty">No opted-in buddies yet. Turn on Event Buddy in your profile and invite someone after they register. ✨</div>'; return; }
        buddyPanel.hidden=false;
        buddyList.innerHTML=data.buddies.slice(0,8).map(b=>{
          const u=b.user||{};
          const avatar=u.avatarUrl?`<img src="${escapeHtml(u.avatarUrl)}" alt="">`:escapeHtml((u.name||'U').charAt(0).toUpperCase());
          const shared=(b.sharedGroups||[]).slice(0,2).map(g=>`<span>${escapeHtml(g.name)}</span>`).join('');
          return `<article class="event-buddy-card"><div class="event-buddy-avatar">${avatar}</div><div class="event-buddy-copy"><strong>${escapeHtml(u.name||'Student')}</strong><span>${escapeHtml([u.department,u.year].filter(Boolean).join(' · ')||'Student')}</span><small>${escapeHtml(b.connectionHint||'Also attending')}</small>${shared?`<div class="event-buddy-shared">${shared}</div>`:''}</div><button class="btn btn-outline btn-sm buddy-message" data-user="${escapeHtml(u.id||u._id)}">Message →</button></article>`;
        }).join('');
        buddyList.querySelectorAll('.buddy-message').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;try{const r=await Api.connectToEventBuddy(btn.dataset.user,event.id);location.href=`chat.html?conversation=${encodeURIComponent(r.conversation?.id||r.conversation?._id||'')}`;}catch(e){showToast(e.message,'error');btn.disabled=false;}});
      } catch(e) { if(e.status!==403 && e.status!==401) console.warn('Event buddy:',e.message); }
    }
    loadEventBuddies();

    const registrationQuestions = Array.isArray(event.customRegistrationQuestions) ? event.customRegistrationQuestions : [];
    calendarBtn.addEventListener('click', () => downloadCalendarEvent(event));
    shareBtn.addEventListener('click', async () => {
      try {
        const result = await shareEvent(event);
        showToast(result === 'shared' ? 'Share sheet opened.' : 'Event link copied to clipboard.');
      } catch (err) {
        if (err.name !== 'AbortError') showToast('Unable to share this event.', 'error');
      }
    });
    shareRegistrationBtn?.addEventListener('click', async () => {
      try {
        const result = await shareRegistrationLink(event);
        showToast(result === 'shared' ? 'Registration share sheet opened.' : 'Smart registration link copied.');
      } catch (err) {
        if (err.name !== 'AbortError') showToast('Unable to share the registration form.', 'error');
      }
    });

    // Load saved state for this event
    let isSaved = false;
    if (loggedIn) {
      Api.getSavedEventIds().then(res => {
        isSaved = (res.eventIds || []).includes(event.id);
        saveBtn.textContent = isSaved ? '♥ Saved' : '♡ Save event';
      }).catch(() => {});
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', async () => {
        if (!loggedIn) {
          window.location.href = `login.html?redirect=event-details.html?id=${encodeURIComponent(event.id)}`;
          return;
        }
        saveBtn.disabled = true;
        try {
          if (isSaved) {
            await Api.removeSavedEvent(event.id);
            isSaved = false;
            showToast('Removed from saved events');
          } else {
            await Api.saveEvent(event.id);
            isSaved = true;
            showToast('Saved this event');
          }
          saveBtn.textContent = isSaved ? '♥ Saved' : '♡ Save event';
        } catch (err) {
          showAlert(alertBox, err.message);
        } finally {
          saveBtn.disabled = false;
        }
      });
    }
    if (waitlistBtn) {
      const refreshWaitlist = async () => {
        try {
          const status = await Api.getWaitlistStatus(event.id);
          waitlistBtn.textContent = status.joined ? 'Leave Waitlist' : 'Join Waitlist';
          waitlistBtn.classList.toggle('btn-danger', status.joined);
          waitlistBtn.classList.toggle('btn-primary', !status.joined);
          if (waitlistStatus) waitlistStatus.textContent = status.joined ? `You are #${status.position} in line (${status.count} waiting).` : `${status.count} people currently waiting.`;
        } catch (err) { if (err.status === 401) waitlistBtn.textContent = 'Login to Join Waitlist'; }
      };
      refreshWaitlist();
      waitlistBtn.addEventListener('click', async () => {
        if (!loggedIn) { window.location.href = `login.html?redirect=event-details.html?id=${encodeURIComponent(event.id)}`; return; }
        waitlistBtn.disabled = true;
        try {
          const status = await Api.getWaitlistStatus(event.id);
          if (status.joined) { await Api.leaveWaitlist(event.id); showAlert(alertBox, 'You left the waitlist.', 'success'); }
          else { await Api.joinWaitlist(event.id); showAlert(alertBox, 'You joined the waitlist.', 'success'); }
          await loadEvent();
        } catch (err) { showAlert(alertBox, err.message); waitlistBtn.disabled = false; }
      });
    }

    if (bookBtn && !full) {
      bookBtn.addEventListener('click', async () => {
        if (!loggedIn) {
          window.location.href = `login.html?redirect=event-details.html?id=${event.id}`;
          return;
        }
        bookBtn.disabled = true;
        bookBtn.textContent = 'Booking...';
        try {
          const registrationAnswers = registrationQuestions.map((q, i) => { const el=document.querySelector(`[data-question-index=\"${i}\"]`); return { question:q.question, answer: el ? (el.type==='checkbox' ? (el.checked ? 'Yes' : '') : String(el.value||'').trim()) : '' }; });
          if (registrationQuestions.some((q, i) => q.required !== false && !registrationAnswers[i].answer)) { showAlert(alertBox, 'Please answer all required registration questions.'); bookBtn.disabled = false; bookBtn.textContent = 'Book This Event'; return; }
          await Api.createBooking(event.id, registrationAnswers);
          showAlert(alertBox, 'Booking confirmed! View it under "My Bookings".', 'success');
          loadEvent();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          if (err.status === 409) {
            showAlert(alertBox, 'You are already registered for this event. Your registration pass is available in My Bookings.', 'success');
            bookBtn.textContent = '✓ Already registered';
            bookBtn.disabled = true;
            bookBtn.onclick = () => { window.location.href = 'my-bookings.html'; };
          } else {
            showAlert(alertBox, err.message);
            bookBtn.disabled = false;
            bookBtn.textContent = 'Book This Event';
          }
        }
      });
    }
  }

  loadEvent();

  async function loadEventMoments(eventId){
    const rail=document.getElementById('momentRail'); if(!rail) return;
    try{const r=await Api.getEventStories(eventId); const list=r.stories||[]; rail.innerHTML=list.length?list.map(st=>`<article class="moment-card">${st.mediaUrl?`<img src="${escapeHtml(st.mediaUrl)}" alt="Event moment" loading="lazy">`:''}<div class="moment-card-copy"><strong>${escapeHtml(st.author?.name||'Student')}</strong><span>${escapeHtml(st.caption||'A moment from campus.')}</span><small>${new Date(st.createdAt).toLocaleDateString()}</small></div></article>`).join(''):`<div class="pulse-empty">No moments yet. Be the first to share one after attending.</div>`;}catch(e){rail.innerHTML='<div class="pulse-empty">Moments are unavailable right now.</div>';}
  }
  function setupEventMoments(event){
    const add=document.getElementById('momentAddBtn'), composer=document.getElementById('momentComposer'), file=document.getElementById('momentFile'), fileName=document.getElementById('momentFileName'), post=document.getElementById('momentPostBtn');
    if(!add) return; add.onclick=()=>{composer.hidden=!composer.hidden;}; file?.addEventListener('change',()=>{fileName.textContent=file.files?.[0]?.name||'No photo selected';});
    post?.addEventListener('click',async()=>{post.disabled=true;try{let media={mediaUrl:'',mediaType:'none'}; if(file?.files?.[0]) media=await Api.uploadEventStoryImage(event.id,file.files[0]); await Api.createEventStory(event.id,{caption:document.getElementById('momentCaption').value,mediaUrl:media.mediaUrl||'',mediaType:media.mediaType||'none'}); document.getElementById('momentCaption').value=''; file.value=''; fileName.textContent='No photo selected'; composer.hidden=true; await loadEventMoments(event.id); showToast('Moment shared ✨');}catch(e){showToast(e.message,'error');}finally{post.disabled=false;}});
    loadEventMoments(event.id);
  }

</script>
</body>
</html>
