<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications - EventHub</title><link rel="stylesheet" href="css/style.css"></head><body><div id="navbar" class="navbar"></div><main class="container" style="max-width:850px"><div class="page-header"><div><span class="eyebrow">UPDATES</span><h1>Notifications</h1><p>Registration, event, club and support updates.</p></div><button class="btn btn-outline" id="read">Mark all read</button></div><div id="alertBox"></div><div id="list"></div></main><script src="js/api.js"></script><script src="js/nav.js"></script><script>requireAuth();renderNavbar('notifications');const list=document.getElementById('list'),alertBox=document.getElementById('alertBox');async function load(){try{const{notifications}=await Api.getNotifications();list.innerHTML=notifications.length?notifications.map(n=>`<a class="card" href="${escapeHtml(n.link||'#')}" style="display:block;margin-bottom:10px;text-decoration:none;${n.readAt?'opacity:.72':''}"><strong>${escapeHtml(n.title)}</strong><p>${escapeHtml(n.message)}</p><span class="muted">${formatDateTime(n.createdAt)}</span></a>`).join(''):`<div class="empty-state"><h3>All caught up</h3><p>You have no notifications.</p></div>`}catch(e){showAlert(alertBox,e.message)}}document.getElementById('read').onclick=async()=>{await Api.markAllNotificationsRead();load()};load();</script></body></html>
